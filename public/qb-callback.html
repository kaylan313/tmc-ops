<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connecting QuickBooks…</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:480px;margin:100px auto;padding:0 24px;color:#3b3030;text-align:center;line-height:1.5;}
  .ok{color:#2f6b3f;}
  .err{color:#a02020;}
</style>
</head>
<body>
<div id="status">Connecting your QuickBooks account…</div>

<!--
  OAuth redirect target for the QuickBooks connection (see
  functions/index.js exchangeQuickBooksCode for the full explanation).
  Intuit redirects the admin's own browser here after they approve access,
  with a one-time `code` and the QuickBooks company id (`realmId`) in the
  URL. This page signs in anonymously (same pattern as report.html) purely
  so it's allowed to CALL the exchange function — it never touches
  Firestore directly, and the function itself is the only code anywhere
  that can read/write the qbTokens collection.
-->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCCLskIvVB40GjB9bXEG2GdMSSBRjvc6-0",
  authDomain: "modern-co-dashboard.firebaseapp.com",
  projectId: "modern-co-dashboard",
  storageBucket: "modern-co-dashboard.firebasestorage.app",
  messagingSenderId: "263317275120",
  appId: "1:263317275120:web:d72654132e07434c155d35"
};
firebase.initializeApp(firebaseConfig);

const params = new URLSearchParams(location.search);
const code = params.get("code");
const realmId = params.get("realmId");
const statusEl = document.getElementById("status");

if (params.get("error")) {
  statusEl.innerHTML = '<span class="err">QuickBooks connection was cancelled or denied.</span><br>You can close this tab and try again from the Scorecard tab.';
} else if (!code || !realmId) {
  statusEl.innerHTML = '<span class="err">Missing information from QuickBooks — this link looks incomplete.</span><br>Close this tab and try connecting again from the Scorecard tab.';
} else {
  firebase.auth().signInAnonymously()
    .then(() => firebase.functions().httpsCallable("exchangeQuickBooksCode")({ code, realmId }))
    .then(() => {
      statusEl.innerHTML = '<span class="ok">✓ QuickBooks connected!</span><br>You can close this tab and go back to the Scorecard.';
    })
    .catch((err) => {
      console.error(err);
      statusEl.innerHTML = '<span class="err">Something went wrong connecting QuickBooks.</span><br>Close this tab and try again from the Scorecard tab.';
    });
}
</script>
</body>
</html>
