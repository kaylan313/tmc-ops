<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Notifications</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:480px;margin:100px auto;padding:0 24px;color:#3b3030;text-align:center;line-height:1.5;}
  .ok{color:#2f6b3f;}
  .err{color:#a02020;}
</style>
</head>
<body>

<!--
  Final landing page after the Gmail OAuth flow — reached only via a 302
  redirect from the gmailOAuthCallback Cloud Function (see
  functions/index.js), never directly. Same reasoning as qb-connected.html:
  no sensitive params of its own, just a plain ok=1/0 flag, so the page a
  browser could bookmark/cache/screenshot never carries an auth code.
-->
<div id="status"></div>
<script>
const ok = new URLSearchParams(location.search).get("ok") === "1";
document.getElementById("status").innerHTML = ok
  ? '<span class="ok">✓ Email notifications connected!</span><br>You can close this tab and go back to the Scorecard.'
  : '<span class="err">Something went wrong connecting email notifications.</span><br>Close this tab and try again from the Scorecard tab.';
</script>
</body>
</html>
