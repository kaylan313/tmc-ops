<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Calendar</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:480px;margin:100px auto;padding:0 24px;color:#3b3030;text-align:center;line-height:1.5;}
  .ok{color:#2f6b3f;}
  .err{color:#a02020;}
</style>
</head>
<body>

<!--
  Final landing page after the Google Calendar OAuth flow — reached only via
  a 302 redirect from the googleCalendarOAuthCallback Cloud Function (see
  functions/index.js), never directly. Same reasoning as gmail-connected.html:
  no sensitive params of its own, just ok=1/0 (+ an optional reason code).
-->
<div id="status"></div>
<script>
const params = new URLSearchParams(location.search);
const ok = params.get("ok") === "1";
const reason = params.get("reason");
document.getElementById("status").innerHTML = ok
  ? '<span class="ok">✓ Google Calendar connected!</span><br>Your deadlines are now in a "TMC Deadlines" calendar in Google. You can close this tab and go back to the Calendar tab.'
  : reason === "scopes"
  ? '<span class="err">Google Calendar wasn\'t connected.</span><br>All the calendar permissions need to stay checked on Google\'s screen — close this tab and click Connect again from the Calendar tab.'
  : '<span class="err">Something went wrong connecting Google Calendar.</span><br>Close this tab and try again from the Calendar tab.';
</script>
</body>
</html>
