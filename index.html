// --- Time tracking view ---
const TIME_FILTER_PRESETS = [
  ["today","Today"], ["last30","Last 30 days"], ["period","This pay period"],
  ["custom","Custom range"], ["all","All time"]
];
const TIME_SORT_OPTIONS = [
  ["clockInDesc","Date (newest first)"], ["clockInAsc","Date (oldest first)"],
  ["enteredDesc","Entry order (newest first)"], ["enteredAsc","Entry order (oldest first)"]
];
function sortTimeEntries(entries, sort){
  const sorted = entries.slice();
  if(sort==="clockInAsc") sorted.sort((a,b)=> new Date(a.clockIn) - new Date(b.clockIn));
  else if(sort==="clockInDesc") sorted.sort((a,b)=> new Date(b.clockIn) - new Date(a.clockIn));
  else if(sort==="enteredAsc") { /* already oldest-entered-first in state.timeEntries */ }
  else sorted.reverse(); // enteredDesc — state.timeEntries arrives oldest-entered-first
  return sorted;
}
function setTimeFilterSort(sort){
  state.timeFilter.sort = sort;
  render();
}
function timeFilterPeriod(){
  const f = state.timeFilter;
  const now = new Date();
  if(f.preset==="today"){
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return { start, end: new Date(start.getTime()+86400000) };
  }
  if(f.preset==="last30"){
    const end = now;
    return { start: new Date(end.getTime()-30*86400000), end };
  }
  if(f.preset==="period") return currentPayrollPeriod();
  if(f.preset==="custom"){
    if(!f.customStart || !f.customEnd) return null;
    const start = parseYMD(f.customStart);
    const end = parseYMD(f.customEnd);
    end.setDate(end.getDate()+1); // inclusive of the selected end day
    return { start, end };
  }
  return null; // "all"
}
function timeFilterLabel(period){
  if(state.timeFilter.preset==="all" || !period) return "All entries";
  return formatPeriodRange(period);
}
function setTimeFilterPreset(preset){
  state.timeFilter.preset = preset;
  render();
}
function setTimeFilterCustom(which, val){
  state.timeFilter[which==="start"?"customStart":"customEnd"] = val;
  render();
}
function setTimeFilterAssistant(assistantId){
  state.timeFilter.assistantId = assistantId;
  render();
}
// Lets the Entries list collapse down to just one task's clock-ins instead
// of scrolling through every entry — the search box reuses the same "#123
// or title" lookup as clock-in/manual-entry, so it's a null-op if nothing
// matches yet (e.g. still mid-typing) rather than erroring.
function setTimeFilterTask(value){
  const task = resolveTaskFromSearch(value);
  state.timeFilter.taskId = task ? task.id : null;
  render();
}
function clearTimeFilterTask(){
  state.timeFilter.taskId = null;
  render();
}
function renderTimeTracking(){
  const mineAll = state.currentAssistant ? state.timeEntries.filter(t=>t.assistantId===state.currentAssistant.id) : state.timeEntries;
  const active = state.currentAssistant && activeEntryFor(state.currentAssistant.id);
  const period = timeFilterPeriod();
  const assistantFilterId = state.role==="admin" ? state.timeFilter.assistantId : "all";
  const taskFilterId = state.timeFilter.taskId;
  const taskFilterTask = taskFilterId ? state.tasks.find(t=>t.id===taskFilterId) : null;
  // Picking a task is a more specific ask than the date/assistant filters —
  // once one's picked, show its FULL history rather than silently hiding
  // entries that fall outside whatever date range happened to be selected.
  const filtered = taskFilterId
    ? mineAll.filter(e => e.taskId===taskFilterId)
    : mineAll
      .filter(e => !period || (new Date(e.clockIn) >= period.start && new Date(e.clockIn) < period.end))
      .filter(e => assistantFilterId==="all" || e.assistantId===assistantFilterId);
  const totalHrs = filtered.reduce((s,e)=>s+entryDurationHours(e),0);
  const manualCount = filtered.filter(e=>e.clockOutManual).length;

  const assistantSummary = state.role==="admin" ? state.settings.assistants
    .filter(a=>assistantFilterId==="all" || a.id===assistantFilterId)
    .map(a=>{
      const own = state.timeEntries.filter(e=>e.assistantId===a.id);
      const own_ = own.filter(e => !period || (new Date(e.clockIn) >= period.start && new Date(e.clockIn) < period.end));
      const total = own_.reduce((s,e)=>s+entryDurationHours(e),0);
      const admin = own_.filter(e=>e.clientId===INTERNAL_CLIENT_ID).reduce((s,e)=>s+entryDurationHours(e),0);
      const manual = own_.filter(e=>e.clockOutManual).length;
      return { assistant:a, total, admin, manual };
    }).filter(r=>r.total>0 || r.assistant.active!==false).sort((a,b)=>b.total-a.total) : [];

  return `
    <h2>Time Tracking</h2>
    ${state.currentAssistant && active ? `
      <div class="card">
        <div class="flex-between">
          <div>
            <div class="small">Currently clocked in</div>
            <strong>${(state.tasks.find(t=>t.id===active.taskId)||{}).title || "Task"}</strong>
          </div>
          <div class="timer-pill">⏱ ${entryDurationHours(active).toFixed(2)} hrs</div>
        </div>
        ${isStale(active) ? `<div class="alert danger" style="margin-top:8px;">This clock has been running over 8 hours — check if it's stale.</div>` : ""}
        <button style="margin-top:10px;" onclick="doClockOut('${active.id}')">Clock out</button>
      </div>` : ""}
    ${state.currentAssistant && !active ? `
      <div class="card">
        <h3>Clock in</h3>
        <input id="clockInTaskSelect" list="clockInTaskList" placeholder="Search by # or title...">
        <datalist id="clockInTaskList">${taskSearchOptions(state.tasks.filter(t=>t.status!=="Done"))}</datalist>
        <button style="margin-top:8px;" onclick="doClockIn()">Clock in</button>
        <div class="small" style="margin:10px 0 6px;">Or for general admin work not tied to a specific task:</div>
        <button class="secondary" onclick="clockInAdminWork(state.currentAssistant.id)">Clock in for Admin Work</button>
      </div>` : ""}
    ${state.currentAssistant ? `
      <div class="card">
        <div class="small" style="margin-bottom:6px;">Forgot to clock in earlier, or logging time after the fact?</div>
        <button class="secondary" onclick="openManualTimeEntry()">Log time manually</button>
      </div>` : ""}
    ${!state.currentAssistant && state.role==="admin" ? `
      <div class="card">
        <button class="secondary" onclick="openManualTimeEntry()">Log time manually for someone</button>
      </div>` : ""}
    ${state.role==="admin" && !taskFilterId ? `
    <div class="card">
      <h3>Hours by assistant</h3>
      <div class="small" style="margin-bottom:8px;">${timeFilterLabel(period)} — "Admin hours" is time clocked to Internal / Modern Co. work. "Manual" counts clock-outs where a time was typed in instead of captured live.</div>
      <div class="table-scroll"><table class="data-table">
        <thead><tr><th>Assistant</th><th>Total hours</th><th>Admin hours</th><th>Manual clock-outs</th></tr></thead>
        <tbody>
          ${assistantSummary.map(r=>`
            <tr>
              <td>${r.assistant.name}${r.assistant.active===false?' <span class="small">(former)</span>':''}</td>
              <td>${r.total.toFixed(1)}</td>

function resolveTaskFromSearch(value){
  const v = (value||"").trim();
  const m = v.match(/^#(\d+)/);
  if(m){
    const t = state.tasks.find(t=>t.taskNumber===parseInt(m[1],10));
    if(t) return t;

  return state.tasks.find(t=>t.title===v) || null;
}

}

function toggleReportReview(clientId){
  if(!state.reportsExpanded) state.reportsExpanded = new Set();
  if(state.reportsExpanded.has(clientId)) state.reportsExpanded.delete(clientId);
  else state.reportsExpanded.add(clientId);
  render();
}
function deleteTaskFromReports(taskId){
  // Same rule as deleteTask() — a time entry can't be left behind with no
  // task to belong to, so this deletes its time right along with it.
  const entries = state.timeEntries.filter(e=>e.taskId===taskId);
  let message = "Delete this task? This can't be undone.";
  if(entries.length > 0){
    const hours = hoursForTask(taskId);
    message = `This task has ${formatHoursMinutes(hours)} clocked into it across ${entries.length} time entr${entries.length===1?'y':'ies'}. Deleting the task will delete that time too — a time entry can't be left behind with no task to belong to.\n\nIf you only meant to fix or remove the time itself, cancel this and use Time Entries instead.\n\nDelete the task AND its time entries?`;
  }
  if(!confirm(message)) return;
  entries.forEach(e=>remove("timeEntries", e.id));
  remove("tasks", taskId);
}

function moveOrgChartRow(rowId, dir){
  const rows = getOrgChartRows().slice();
  const i = rows.findIndex(r=>r.id===rowId);
  const j = i+dir;
  if(i<0 || j<0 || j>=rows.length) return;
  [rows[i], rows[j]] = [rows[j], rows[i]];
  saveOrgChartRows(rows);
}

  const flag = document.getElementById("ocm_flag").value.trim();
  const rows = getOrgChartRows().map(r=>r.id!==rowId ? r : {

// Native HTML5 drag & drop — dragging a seat onto another seat inserts it
// just before that seat (in the same or a different row); dragging onto the
// empty space in a row appends it to the end of that row.
function ocDragStart(e, rowId, seatId){
  state.ocDrag = { rowId, seatId };
  e.dataTransfer.effectAllowed = "move";
}
function ocMoveSeat(fromRowId, seatId, toRowId, beforeSeatId){
  const rows = getOrgChartRows().map(r=>({ ...r, seats:[...r.seats] }));
  const fromRow = rows.find(r=>r.id===fromRowId);
  const idx = fromRow.seats.findIndex(s=>s.id===seatId);
  if(idx<0) return;
  const [seat] = fromRow.seats.splice(idx,1);
  const toRow = rows.find(r=>r.id===toRowId);
  const beforeIdx = beforeSeatId ? toRow.seats.findIndex(s=>s.id===beforeSeatId) : -1;
  if(beforeIdx>=0) toRow.seats.splice(beforeIdx,0,seat);
  else toRow.seats.push(seat);
  saveOrgChartRows(rows);
}
function ocDrop(e, targetRowId, targetSeatId){
  e.preventDefault(); e.stopPropagation();
  const drag = state.ocDrag;
  state.ocDrag = null;
  if(!drag || (drag.rowId===targetRowId && drag.seatId===targetSeatId)) return;
  ocMoveSeat(drag.rowId, drag.seatId, targetRowId, targetSeatId);
}
function ocDropOnRow(e, targetRowId){
  e.preventDefault();
  const drag = state.ocDrag;
  state.ocDrag = null;
  if(!drag) return;
  ocMoveSeat(drag.rowId, drag.seatId, targetRowId, null);
}

function downloadEmployeeAgreement(assistantId){

  const html = a.agreementHtml || employmentAgreementHtml(a);
  const signedDate = a.agreementSignedAt ? new Date(a.agreementSignedAt).toLocaleDateString() : "";
  const full = `<!doctype html><html><head><meta charset="UTF-8"><title>${a.name} — Independent Contractor Agreement</title>
<style>body{font-family:Georgia,serif;max-width:720px;margin:40px auto;padding:0 20px;color:#241a17;line-height:1.5;}</style>
</head><body>
${html}
<div style="margin-top:24px;padding-top:14px;border-top:1px solid #ccc;">
<p><strong>Signed by:</strong> ${a.agreementSignedName||a.name}</p>
<p><strong>Date:</strong> ${signedDate}</p>
</div>
</body></html>`;
  const blob = new Blob([full], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const el = document.createElement("a");
  el.href = url;
  el.download = a.name.replace(/[^a-z0-9]+/gi,"-") + "-independent-contractor-agreement.html";

// No file-storage backend here (Firestore only), so a client photo gets
// resized/compressed to a JPEG data URL and stored right on the task
// document — keeps it well under Firestore's ~1MB document size limit
// instead of failing silently on a full-size phone photo.
function readAndCompressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let width = img.width, height = img.height;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width*scale);
          height = Math.round(height*scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
// Non-image files (PDFs, docs) can't be resized like a photo, so they're
// capped hard — there's no cloud storage wired up, everything lives inline
// on the Firestore doc, which tops out around 1MB total. Attachments share
// a combined budget well under that ceiling so title/subtasks/discussion
// always have room too — otherwise a doc can quietly exceed Firestore's
// limit and the write just fails (silently, before the fix that now alerts
// on a failed save).
const MAX_ATTACHMENT_BYTES = 400000;
const MAX_ATTACHMENTS_TOTAL_BYTES = 650000;
function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function currentAttachmentsBytes(task){
  return (task.attachments||[]).reduce((s,a)=>s+(a.dataUrl?a.dataUrl.length:0),0) + (task.requestImage?task.requestImage.length:0);
}
async function addTaskAttachment(taskId){
  const input = document.getElementById("tf_attachment");
  const file = input.files && input.files[0];
  if(!file) return;
  const task = state.tasks.find(t=>t.id===taskId) || (state.modal && state.modal.task);
  if(!task) return;
  let dataUrl;
  try{
    if(file.type.startsWith("image/")){
      dataUrl = await readAndCompressImage(file, 1400, 0.75);
    } else {
      if(file.size > MAX_ATTACHMENT_BYTES){
        alert(`That file is too big (${Math.round(file.size/1000)}KB) — attachments are capped around ${Math.round(MAX_ATTACHMENT_BYTES/1000)}KB since there's no separate file storage yet. Try a smaller file or a screenshot instead.`);
        return;
      }
      dataUrl = await readFileAsDataURL(file);
    }
  }catch(e){
    console.warn("Attachment read failed:", e);
    alert("Couldn't read that file.");
    return;
  }
  if(currentAttachmentsBytes(task) + dataUrl.length > MAX_ATTACHMENTS_TOTAL_BYTES){
    alert("This task's attachments are getting too large to save reliably. Remove an existing attachment before adding another, or attach fewer/smaller files.");
    return;
  }
  const attachments = [...(task.attachments||[]), {
    id: newId("attach"), name: file.name, type: file.type || "application/octet-stream",
    dataUrl, uploadedAt: new Date().toISOString()
  }];
  task.attachments = attachments;
  upsert("tasks", taskId, { attachments });
  input.value = "";
  render();
}
function removeTaskAttachment(taskId, attachmentId){
  const task = state.tasks.find(t=>t.id===taskId) || (state.modal && state.modal.task);
  if(!task) return;
  const attachments = (task.attachments||[]).filter(a=>a.id!==attachmentId);
  task.attachments = attachments;
  upsert("tasks", taskId, { attachments });
  render();
}
async function submitClientTaskRequest(clientId){
  const titleEl = document.getElementById("reqTitle");
  const detailsEl = document.getElementById("reqDetails");
  const categoryEl = document.getElementById("reqCategory");
  const imageEl = document.getElementById("reqImage");
  const submitBtn = document.getElementById("reqSubmitBtn");
  const title = titleEl.value.trim();
  if(!title){ alert("Please enter what you'd like help with."); return; }

  submitBtn.disabled = true;
  submitBtn.textContent = "Submitting...";

  let requestImage = null;
  if(imageEl.files && imageEl.files[0]){
    submitBtn.textContent = "Processing photo...";
    try{
      requestImage = await readAndCompressImage(imageEl.files[0], 1000, 0.7);
    }catch(e){
      console.warn("Image processing failed:", e);
      alert("Couldn't process that photo — submitting the request without it.");
    }
    submitBtn.textContent = "Submitting...";
  }

  const client = state.clients.find(c=>c.id===clientId);
  const task = {
    id: newId("task"),
    title,
    clientId,
    status: "Pending approval",
    category: categoryEl.value,
    taskNumber: await allocateTaskNumber(),
    assignees: (client && client.assistantIds) || [],
    subtasks: [],
    discussion: [],
    description: "",
    clientRequestNote: detailsEl.value.trim(),
    requestedByClient: true
  };
  if(requestImage) task.requestImage = requestImage;

  // upsert() resolves false (and shows its own error alert) if the write
  // failed — only tell the client it went through, and only clear the form,
  // once it's actually confirmed. Otherwise leave everything they typed in
  // place so they don't have to retype it, and let them try again.
  const saved = await upsert("tasks", task.id, task);
  if(saved){
    alert("Request submitted — your assistant will review and confirm it shortly.");
    // Fields are bound to clientRequestDraft now (see the state comment),
    // so clearing the form on success means resetting that, not just
    // relying on a re-render to blank out unbound inputs.
    state.clientRequestDraft = { title: "", details: "", category: "Home" };
    render();
  } else {
    submitBtn.disabled = false;
    submitBtn.textContent = "Submit request";
  }
}

// Assigns the next task number atomically via a shared Firestore counter,
// instead of computing max(existing)+1 from whatever's in the local task
// list. The old approach let two people creating tasks around the same
// moment (before either write had synced back to the other's browser)
// both compute the same "next" number off their own stale local copy —
// that's the #586-on-two-different-tasks bug. A transaction serializes
// this: Firestore retries one side automatically if they race, so no two
// calls can ever walk away with the same value.
async function allocateTaskNumber(){
  if(!db){
    // Local-only/demo mode has no shared counter to coordinate through —
    // fall back to the old best-effort approach, which is fine since
    // there's only one browser involved.
    return state.tasks.reduce((max,t)=>Math.max(max, t.taskNumber||0), 0) + 1;
  }
  const counterRef = col("settings").doc("taskCounter");
  return db.runTransaction(async (tx) => {
    const snap = await tx.get(counterRef);
    // First run ever (counter doc doesn't exist yet): start from whatever
    // the highest existing task number already is, so it doesn't restart
    // at 1 and collide with real tasks already numbered well past that.
    const current = snap.exists ? (snap.data().value || 0)
      : state.tasks.reduce((max,t)=>Math.max(max, t.taskNumber||0), 0);
    const next = current + 1;
    tx.set(counterRef, { value: next }, { merge: true });
    return next;
  });
}
// Task numbers are no longer assigned here, at draft-creation time — a
// "New task" modal can sit open for minutes while someone fills it in,

function toggleSubtask(taskId, i){
  const task = state.tasks.find(t=>t.id===taskId) || (state.modal && state.modal.task);
  if(!task || !(task.subtasks||[])[i]) return;
  const subtasks = (task.subtasks||[]).slice();
  subtasks[i] = { ...subtasks[i], done: !subtasks[i].done };
  // Mutate the in-memory task too, not just Firestore — saveTask() reads
  // task.subtasks when the Save button is clicked, and without this it
  // would silently write the pre-toggle array back over this change.
  task.subtasks = subtasks;
  upsert("tasks", taskId, { subtasks });
  render();
}
function addSubtaskDraft(taskId){
  const input = document.getElementById("tf_new_subtask");
  const text = input.value.trim();

function addTaskComment(taskId){

}
function markCommentSeen(taskId, commentId){
  if(!state.currentAssistant) return;
  const task = state.tasks.find(t=>t.id===taskId) || (state.modal && state.modal.task);
  if(!task) return;
  const discussion = (task.discussion||[]).map(d=>{
    if(d.id!==commentId) return d;
    const seenBy = d.seenBy||[];
    if(seenBy.some(s=>s.assistantId===state.currentAssistant.id)) return d;
    return { ...d, seenBy: [...seenBy, { assistantId: state.currentAssistant.id, name: state.currentAssistant.name, seenAt: new Date().toISOString() }] };
  });
  task.discussion = discussion;
  upsert("tasks", taskId, { discussion });
  render();
}

// Catches the "task about a client left tagged Internal" trap: new tasks
// default to Internal/Modern Co. when there's no client context (e.g.
// created from the Task Board instead of inside a client's Tasks tab), and
// since time-entry clientId is copied straight from the task at clock-in,
// a task that never gets its Client field corrected silently sends every
// hour logged against it to admin hours instead of that client's hours.
function suggestClientFromTitle(title){
  const t = (title||"").toLowerCase();
  if(!t) return null;
  return state.clients.find(c=>{
    const first = (c.name||"").split(" ")[0];
    return first && first.length>2 && t.includes(first.toLowerCase());
  }) || null;
}
async function saveTask(taskId){
  const task = state.modal.task;
  const assignees = Array.from(document.querySelectorAll(".tf_assignee:checked")).map(el=>el.value);
  const newStatus = document.getElementById("tf_status").value;
  // Stamp completedAt the moment a task lands on Done, and clear it if it's
  // reopened — the weekly client report needs to know WHEN a task finished,
  // not just that it's currently sitting in Done. A manually-set completed
  // date (e.g. correcting a status today for a task actually finished weeks
  // ago) always wins over the auto-stamp, so it doesn't wrongly land on a
  // report it doesn't belong on.
  const completedField = document.getElementById("tf_completed").value;
  let completedAt = task.completedAt || null;
  if(newStatus === "Done"){
    if(completedField) completedAt = new Date(completedField + "T12:00:00").toISOString();
    else if(task.status !== "Done") completedAt = new Date().toISOString();
  } else {
    completedAt = null;
  }
  // Only ever allocated once — a task keeps the number it was first saved
  // with for its whole life, same as before.
  let taskNumber = task.taskNumber;
  if(!taskNumber){
    try {
      taskNumber = await allocateTaskNumber();
    } catch(err){
      console.warn("Task numbering failed:", err);
      alert("This didn't save — " + err.message + "\n\nCheck your connection and try again. If it keeps happening, tell Kaylan.");
      return;
    }
  }
  const payload = {
    title: document.getElementById("tf_title").value.trim(),
    clientId: document.getElementById("tf_client").value,
    category: document.getElementById("tf_category").value,
    status: newStatus,
    description: document.getElementById("tf_description").value.trim(),
    privateNotes: document.getElementById("tf_private_notes").value.trim(),
    dueDate: document.getElementById("tf_due").value,
    priority: document.getElementById("tf_priority").checked,
    taskNumber,
    assignees,
    subtasks: task.subtasks || [],
    discussion: task.discussion || [],
    completedAt
  };
  if(payload.clientId === INTERNAL_CLIENT_ID){
    const suggested = suggestClientFromTitle(payload.title);
    if(suggested && !confirm(`This task's title mentions ${suggested.name}, but Client is set to "Internal / Modern Co." — any time clocked on it will count as admin hours instead of ${suggested.name}'s.\n\nSave it as Internal anyway?`)){
      return;
    }
  }
  upsert("tasks", taskId, payload);
  closeModal();
}
// A time entry should never be able to outlive the task it was clocked
// into — that's exactly how orphaned entries happened before this: the
// task went away, its time silently kept counting toward the client's
// hours-used with no visible task left to explain it (found the hard way
// auditing a client's numbers not adding up). So deleting a task with time
// on it now deletes that time right along with it, instead of leaving it
// behind — if someone only meant to fix/remove the time itself, Time
// Entries is where that happens, not here.
function deleteTask(taskId){
  const entries = state.timeEntries.filter(e=>e.taskId===taskId);
  let message = "Delete this task?";
  if(entries.length > 0){
    const hours = hoursForTask(taskId);
    message = `This task has ${formatHoursMinutes(hours)} clocked into it across ${entries.length} time entr${entries.length===1?'y':'ies'}. Deleting the task will delete that time too — a time entry can't be left behind with no task to belong to.\n\nIf you only meant to fix or remove the time itself, cancel this and use Time Entries instead.\n\nDelete the task AND its time entries?`;
  }
  if(confirm(message)){
    entries.forEach(e=>remove("timeEntries", e.id));
    remove("tasks", taskId);
    closeModal();
  }
}

  const d = new Date(iso);

}

    <div class="modal">
      <h3>Log time manually</h3>
      <div class="small" style="margin-bottom:8px;">For time already worked without clocking in live — enter the real clock-in/out times. Add multiple blocks below if this task had more than one session.</div>
      ${state.role==='admin' ? `
      <div class="row">
        <div><label class="small">Assistant</label>
          <select id="mte_assistant">
            ${state.settings.assistants.filter(a=>a.active!==false).map(a=>`<option value="${a.id}">${a.name}</option>`).join("")}
          </select>
        </div>
      </div>` : ""}
      <div class="row" style="margin-top:8px;">
        <div><label class="small">Task</label>
          <input id="mte_task" list="mte_task_list" placeholder="Search by # or title...">
          <datalist id="mte_task_list">${taskSearchOptions(state.tasks)}</datalist>
        </div>
      </div>
      <div style="margin-top:10px;">
        <label class="small">Time blocks for this task</label>
        ${rows.map((r,i)=>`
          <div class="row" style="margin-top:6px;align-items:flex-end;">
            <div><label class="small">Clock in</label><input type="datetime-local" id="mte_in_${r.id}" value="${r.clockIn}" onchange="updateManualEntryRow('${r.id}','clockIn',this.value)"></div>
            <div><label class="small">Clock out</label><input type="datetime-local" id="mte_out_${r.id}" value="${r.clockOut}" onchange="updateManualEntryRow('${r.id}','clockOut',this.value)"></div>
            <div><label class="small">Note (optional)</label><input id="mte_note_${r.id}" value="${(r.note||'').replace(/"/g,'&quot;')}" oninput="updateManualEntryRow('${r.id}','note',this.value)"></div>
            ${rows.length>1 ? `<button class="danger" style="padding:8px;" onclick="removeManualEntryRow('${r.id}')">✕</button>` : ""}
          </div>
        `).join("")}
        <button class="secondary" style="margin-top:8px;" onclick="addManualEntryRow()">+ Add another time block</button>
      </div>
      <div style="margin-top:14px;display:flex;justify-content:flex-end;gap:8px;">
        <button class="secondary" onclick="closeModal()">Cancel</button>
        <button onclick="saveManualTimeEntry()">Log time</button>
      </div>
    </div>
  `;
}
function saveManualTimeEntry(){
  const task = resolveTaskFromSearch(document.getElementById("mte_task").value);
  const assistantId = state.role==='admin' ? document.getElementById("mte_assistant").value : state.currentAssistant.id;
  if(!task){ alert("Pick a task from the list first — search by its # or title."); return; }
  const rows = state.modal.rows;
  for(const r of rows){
    if(!r.clockIn || !r.clockOut){ alert("Every time block needs both a clock in and clock out."); return; }
    if(new Date(r.clockOut) <= new Date(r.clockIn)){ alert("Clock out has to be after clock in on every time block."); return; }
  }
  rows.forEach(r=>{
    const entry = {
      id: newId("te"),
      taskId: task.id, assistantId,
      clientId: task.clientId || INTERNAL_CLIENT_ID,
      clockIn: fromDatetimeLocalValue(r.clockIn), clockOut: fromDatetimeLocalValue(r.clockOut), clockOutManual: true,
      note: (r.note||"").trim(),
    };
    upsert("timeEntries", entry.id, entry);
  });
  closeModal();
}
function openTimeEntryEditor(entryId){
  const entry = state.timeEntries.find(e=>e.id===entryId);
  if(!entry) return;
  state.modal = { type:"timeEntryEditor", entry };
  render();
}
function renderTimeEntryEditorModal(entry){
  const task = state.tasks.find(t=>t.id===entry.taskId);
  return `
    <div class="modal">
      <h3>Edit time entry</h3>
      <div class="small" style="margin-bottom:8px;">${task ? task.title : '(deleted task)'}${entry.clientId===INTERNAL_CLIENT_ID ? ' · Internal / Modern Co.' : ''}</div>
      ${state.role==='admin' ? `
      <div class="row">
        <div><label class="small">Assistant</label>
          <select id="tef_assistant">
            ${state.settings.assistants.map(a=>`<option value="${a.id}" ${entry.assistantId===a.id?'selected':''}>${a.name}${a.active===false?' (former)':''}</option>`).join("")}
          </select>
        </div>
      </div>` : ""}
      <div class="row" style="margin-top:8px;">
        <div><label class="small">Clock in</label><input type="datetime-local" id="tef_in" value="${toDatetimeLocalValue(entry.clockIn)}"></div>
        <div><label class="small">Clock out (blank = still clocked in)</label><input type="datetime-local" id="tef_out" value="${toDatetimeLocalValue(entry.clockOut)}"></div>
      </div>
      <div style="margin-top:8px;">
        <label class="small">Note</label>
        <input id="tef_note" value="${(entry.note||'').replace(/"/g,'&quot;')}" placeholder="What this entry covers">
      </div>
      ${state.role==='admin' ? `
      <div style="margin-top:10px;">
        <label style="display:inline-flex;align-items:center;gap:6px;font-size:13px;">
          <input type="checkbox" id="tef_flagged" ${entry.flagged?'checked':''}> Flag for review
        </label>
      </div>
      <div style="margin-top:8px;">
        <label class="small">Flag reason (optional)</label>
        <input id="tef_flagnote" value="${(entry.flagNote||'').replace(/"/g,'&quot;')}">
      </div>` : ""}
      <div style="margin-top:14px;display:flex;justify-content:space-between;">
        <button class="danger" onclick="deleteTimeEntry('${entry.id}'); closeModal();">Delete</button>
        <div>
          <button class="secondary" onclick="closeModal()">Cancel</button>
          <button onclick="saveTimeEntryEdit('${entry.id}')">Save</button>
        </div>
      </div>
    </div>
  `;
}
function saveTimeEntryEdit(entryId){
  const clockIn = fromDatetimeLocalValue(document.getElementById("tef_in").value);
  const clockOut = fromDatetimeLocalValue(document.getElementById("tef_out").value);
  if(!clockIn){ alert("Clock in time is required."); return; }
  if(clockOut && new Date(clockOut) <= new Date(clockIn)){ alert("Clock out has to be after clock in."); return; }
  const payload = {
    clockIn,
    clockOut,
    clockOutManual: true,
    note: document.getElementById("tef_note").value.trim(),
  };
  if(state.role==='admin'){
    payload.assistantId = document.getElementById("tef_assistant").value;
    payload.flagged = document.getElementById("tef_flagged").checked;
    payload.flagNote = document.getElementById("tef_flagnote").value.trim();
  }
  upsert("timeEntries", entryId, payload);
  closeModal();
}

// --- Modal shell ---
function renderModal(){
  if(!state.modal) return "";
  const content = state.modal.type==="taskEditor" ? renderTaskEditorModal(state.modal.task)
    : state.modal.type==="clientEditor" ? renderClientEditorModal(state.modal.client)
    : state.modal.type==="employeeEditor" ? renderEmployeeEditorModal()
    : state.modal.type==="agreementGate" ? renderAgreementGateModal(state.modal.assistant)
    : state.modal.type==="reassignClient" ? renderReassignModal(state.modal.client)
    : state.modal.type==="timeEntryEditor" ? renderTimeEntryEditorModal(state.modal.entry)
    : state.modal.type==="appGuide" ? renderAppGuideModal(state.modal.assistant)
    : state.modal.type==="appGuideReadOnly" ? renderAppGuideReadOnlyModal()
    : state.modal.type==="policyBook" ? renderPolicyBookModal()
    : state.modal.type==="manualTimeEntry" ? renderManualTimeEntryModal()
    : state.modal.type==="imageViewer" ? renderImageViewerModal(state.modal.dataUrl)
    : state.modal.type==="orgChartSeat" ? renderOrgChartSeatModal(state.modal.rowId, state.modal.seat)
    : "";
  const dismissable = state.modal.type !== "agreementGate" && state.modal.type !== "appGuide";
  return `<div class="modal-bg" onclick="${dismissable ? "if(event.target===this) closeModal()" : ""}">${content}</div>`;
}
function closeModal(){ state.modal = null; render(); }

// ---- Boot ----
boot();
</script>
</body>
</html>
