<style>
  :root{

    --cream:#f6efe6;
    --cream-dark:#ece2d3;
    --rose:#c9a3a0;
    --rose-dark:#a97f7c;
    --text:#2c211d;

    --warn:#c98a2c;
    --ok:#4c7a5e;
    --radius:10px;
    --shadow:0 2px 10px rgba(36,26,23,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Jost',sans-serif;
    background:var(--cream);
    color:var(--text);
  }
  h1,h2,h3,h4{
    font-family:'Playfair Display',serif;
    color:var(--brown-dark);

  }
  button{
    font-family:'Jost',sans-serif;

  button.danger{background:var(--danger);color:#fff;}

<body>
<div id="app"></div>

<script>
/* =========================================================================
   THE MODERN CONCIERGE — INTERNAL OPS PLATFORM
   Single-file HTML/vanilla JS, Firestore-backed.

   SETUP REQUIRED:
   1. Replace `firebaseConfig` below with your project's config (same
      Firebase project already used for the orientation-sync integration).
   2. In Firestore, create a `settings/access` document (see SEED_SETTINGS
      below for shape) with your real admin passcode, assistant access
      codes, and client portal codes — this file seeds it automatically
      on first run if it doesn't exist yet.
   3. Set Firestore security rules appropriately before going to
      production — this app currently assumes rules are permissive for
      the passcode-gated collections. Tightening this is a good first
      task to hand to Claude Code.

   RESILIENCE NOTE: Firebase init is wrapped in try/catch and the UI
   renders before any Firestore call is attempted, so a missing/blocked
   SDK or bad config degrades to a local-only demo mode with a visible
   warning banner, instead of a blank page.
   ========================================================================= */

// ---- 1. Firebase config ----
const firebaseConfig = {
  apiKey: "AIzaSyCCLskIvVB40GjB9bXEG2GdMSSBRjvc6-0",
  authDomain: "modern-co-dashboard.firebaseapp.com",
  projectId: "modern-co-dashboard",
  storageBucket: "modern-co-dashboard.firebasestorage.app",
  messagingSenderId: "263317275120",
  appId: "1:263317275120:web:d72654132e07434c155d35"
};
const FIREBASE_CONFIGURED = firebaseConfig.apiKey !== "YOUR_API_KEY";
let db = null;
let FIREBASE_AVAILABLE = false;
try{
  if(typeof firebase === "undefined") throw new Error("Firebase SDK did not load (blocked script or no network).");
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  FIREBASE_AVAILABLE = true;
}catch(e){
  console.warn("Firebase failed to initialize — running in local-only mode:", e);
}

// ---- 2. Seed data (used only if Firestore collections are empty) ----
const SEED_ASSISTANTS = [
  { name:"Alex", active:false },
  { name:"Victoria Haas" },
  { name:"Heidi Jo Peaden", hireDate:"2026-04-15" },
  { name:"Cherish Campbell" },
  { name:"Livia Goree" },
  { name:"Shae Trahan" },
  { name:"Victoria Oser" },
  { name:"Olivia Vanderhoeven" },
  { name:"Rachel Morvant" }
].map((a,i)=>({ id:"asst_"+(i+1), accessCode:"", active:true, agreementSigned:true, hourlyRate:22, hireDate:"", ...a }));

const SEED_SETTINGS = {
  adminPasscode: "melain10",
  assistants: SEED_ASSISTANTS,
  internalHoursBudget: 0
};

const INTERNAL_CLIENT_ID = "internal";
// Home base (Lafayette) is the implicit default for anyone/anything that
// existed before markets were tracked — new markets get added here as they
// open rather than needing a schema change.
const MARKETS = ["Lafayette","Baton Rouge","Denver","Virtual"];
const STATUSES = ["To do","Researching","In progress","Pending approval","Done"];
const TIER_THRESHOLDS = [50,75,90,100];
// Real rate card from the Personal Assistant Services Agreement — same
// pricing regardless of term type (pilot / 3-month / 12-month). A client
// picks ONE package tier — Home Reset is an alternative tier, not an add-on
// stacked on top of an hourly membership — so it shares the exact same
// packageHours/packagePrice/cycle machinery as the hourly tiers below.
const PACKAGE_TIERS = [
  { key:"m20", label:"Membership — 20 hrs/mo", hours:20, price:950 },
  { key:"m40", label:"Membership — 40 hrs/mo", hours:40, price:1700 },
  { key:"m60", label:"Membership — 60 hrs/mo", hours:60, price:2400 },
  { key:"m80", label:"Membership — 80 hrs/mo", hours:80, price:3200 },
  { key:"reset_refresh", label:"Home Reset — The Refresh", hours:6, price:325 },
  { key:"reset_restore", label:"Home Reset — The Restore", hours:12, price:575 }
];
const OVERAGE_RATE = 50; // $/hr beyond the package

// ---- 3. App state ----
let state = {
  view: "login",
  role: null,            // 'admin' | 'team' | 'client'
  currentAssistant: null,
  currentClientId: null,
  settings: SEED_SETTINGS,
  firebaseError: null,
  clients: [],
  tasks: [],
  timeEntries: [],
  activeTab: "dashboard",
  crmSubTab: "tasks",
  selectedClientId: null,
  modal: null,
  timeFilter: { preset: "last30", customStart: null, customEnd: null, assistantId: "all", taskId: null, sort: "clockInDesc" },
  payrollFilter: { preset: "period", assistantId: "all", adminOnly: false },
  payrollReportPeriod: "period", // "period" (current) or "lastPeriod" — which payroll period the per-assistant report/email download covers
  clientHoursFilter: { preset: "week" },
  kanbanFilter: { clientId: "all", category: "all", onlyMine: false, hideDone: true },
  clientMarketFilter: "all",
  // The client request form's fields used to be uncontrolled (no value=
  // binding), so a background render() — from any other client/assistant's
  // unrelated Firestore write, or the 60-second timer refresh — silently
  // wiped out whatever the client had typed before they got to Submit.
  // Keeping the draft here means a render mid-typing just redraws the
  // inputs with the same values already in them, instead of blanking them.
  clientRequestDraft: { title: "", details: "", category: "Home" }
};

// ---- 4. Firestore helpers ----
function col(name){
  if(!db) throw new Error("Firebase is not connected.");
  return db.collection(name);
}

async function ensureSettings(){
  const ref = col("settings").doc("access");
  const snap = await ref.get();
  if(!snap.exists){
    await ref.set(SEED_SETTINGS);
    return SEED_SETTINGS;
  }
  return snap.data();
}

function subscribe(name, onChange, attempt){
  attempt = attempt || 0;
  // A Firestore listener that errors (e.g. a transient quota blip) doesn't
  // come back on its own — once the error callback fires, that listener is
  // dead for good. Without this, the page silently stops seeing any new
  // data (new clients, tasks, clock-ins...) until someone thinks to
  // manually reload it. Auto-resubscribing means a blip just causes a
  // few-second gap instead of a stuck page.
  return col(name).onSnapshot(snap=>{
    const items = [];
    snap.forEach(d=>items.push({ id:d.id, ...d.data() }));
    if(state.firebaseError){ state.firebaseError = null; }
    onChange(items);
  }, err=>{
    console.warn("Firestore subscription failed for '" + name + "':", err);
    state.firebaseError = err.message;
    render();
    // Back off exponentially (5s, 10s, 20s... capped at 2min) instead of
    // retrying every 5s forever — a durably broken connection retried at a
    // fixed short interval is exactly what can exhaust Firestore's quota,
    // which already happened once. A permission error also won't be fixed
    // by waiting, so don't bother retrying that at all.
    if(err.code === "permission-denied") return;
    const delay = Math.min(5000 * Math.pow(2, attempt), 120000);
    setTimeout(()=>subscribe(name, onChange, attempt+1), delay);
  });
}

// Without Firebase connected, `state.clients`/`tasks`/`timeEntries` would
// otherwise never change (they're normally only ever updated by the Firestore
// onSnapshot listeners in boot()), so every write would silently vanish and
// e.g. a freshly-created client could never be found. Mirror the write into
// the matching in-memory array so local/demo mode is actually usable —
// it still won't survive a page reload until real Firebase config is in place.
function upsertLocal(name, id, data){
  const arr = state[name];
  if(!Array.isArray(arr)) return;
  const idx = arr.findIndex(x=>x.id===id);
  if(idx>=0) arr[idx] = { ...arr[idx], ...data, id };
  else arr.push({ id, ...data });
}
function removeLocal(name, id){
  const arr = state[name];
  if(!Array.isArray(arr)) return;
  state[name] = arr.filter(x=>x.id!==id);
}
// Resolves true on success, false on failure — callers that need to know
// whether a write actually landed (e.g. the client request form, which must
// not tell the client "submitted" if it didn't) can await this and check.
// Every other call site is fire-and-forget and ignores the resolved value,
// so changing it from "always resolves" to "resolves true/false" is safe.
function upsert(name, id, data){
  if(!db){
    console.warn("Firebase not connected — saving locally only (won't survive a reload):", name, id, data);
    upsertLocal(name, id, data);
    render();
    return Promise.resolve(true);
  }
  return col(name).doc(id).set(data, { merge:true }).then(()=>true).catch(err=>{
    console.warn("Write to '" + name + "' failed:", err);
    alert("This didn't save — " + err.message + "\n\nCheck your connection and try again. If it keeps happening, tell Kaylan.");
    return false;
  });
}
function remove(name, id){
  if(!db){
    console.warn("Firebase not connected — deleting locally only:", name, id);
    removeLocal(name, id);
    render();
    return Promise.resolve();
  }
  return col(name).doc(id).delete().catch(err=>{
    console.warn("Delete from '" + name + "' failed:", err);
  });
}
function newId(prefix){
  return prefix + "_" + Date.now() + "_" + Math.random().toString(36).slice(2,7);
}

// ---- 5. Boot ----
// Demo/test data for local-only mode (no Firebase configured yet) — lets you
// click through every feature (tasks, time entries, hours-used tiers, the
// weekly/period reports, the client portal) without hand-building a client
// first. Timestamps are relative to "now" so it always lands inside the
// current week/pay period/billing month, whenever it's actually opened.
// Only ever runs when Firebase isn't connected, so it can never touch real data.
function seedDemoData(){
  const now = Date.now();
  const hoursAgo = h => new Date(now - h*3600000).toISOString();
  const clientId = "client_demo_1";
  const heidiId = "asst_3"; // Heidi Jo Peaden

  const client = {
    id: clientId,
    name: "Test Client (Demo)",
    packageHours: 20,
    packagePrice: 900,
    cycleType: "monthly",
    renewalDate: "2026-01-01",
    assistantIds: [heidiId],
    email: "test.client@example.com",
    portalCode: "demo123",
    referredBy: heidiId,
    termType: "3month",
    termStartDate: new Date(now - 24*60*3600000).toISOString().slice(0,10),
    clientStatus: "active",
    referralPayoutsPaidCount: 1,
    createdAt: hoursAgo(24*30),
    notes: [
      { id:"note_demo_1", text:"Great first onboarding call — very organized already.", date: hoursAgo(72), source:"manual" }
    ],
    specialDates: [
      { label:"Client's birthday", date:"1990-07-25" },
      { label:"Anniversary", date:"2015-09-10" }
    ],
    vendors: [ { name:"Green Clean Co.", service:"House cleaning", lastService: hoursAgo(9*24).slice(0,10), frequencyDays:30 } ],
    inspections: [ { name:"HVAC inspection", nextDue: new Date(now + 10*24*3600000).toISOString().slice(0,10) } ],
    profile: {
      serviceType: "both",
      phone: "555-123-4567",
      emergencyContact: "Jamie Doe — 555-987-6543",
      homeAddress: "123 Demo Lane, Austin, TX",
      familyMembers: [ { name:"Alex Jr.", age:"8" }, { name:"Riley", age:"5" } ],
      homeAccess: "Hidden key under the third flowerpot on the porch. Alarm code: 4821.",
      topPriorities: ["Weekly grocery restock","Inbox triage","Vendor coordination"],
      weeklySchedule: "Mon/Wed/Fri mornings preferred for home visits.",
      petInfo: "One dog (Biscuit) — feed 2x daily, leash walks only.",
      specialPreferences: "Prefers text over email. Organic groceries only.",
      communicationPreference: "Text — responds fastest 9am–5pm.",
      budgetNotes: "Pre-approved up to $150/week for groceries without checking in.",
      offLimits: "Do not rearrange the home office.",
      officeAddress: "456 Business Blvd, Austin, TX",
      officeHours: "9am–5pm, Mon–Fri",
      teamMembers: "Jordan (Ops), Casey (Sales)",
      businessTools: "Gmail, Asana, QuickBooks",
      businessNeeds: "Inbox management and light bookkeeping support."
    }
  };

  const tasks = [
    { id:"task_demo_1", title:"Guest messaging", clientId, status:"Done", category:"Home",
      assignees:[heidiId], subtasks:[{text:"Reply to guest inquiries",done:true},{text:"Update FAQ doc",done:true}],
      discussion:[], description:"Handled guest messaging across platforms.", completedAt: hoursAgo(48) },
    { id:"task_demo_2", title:"Website — Creation", clientId, status:"Done", category:"Business",
      assignees:[heidiId], subtasks:[], discussion:[], description:"Worked on website creation.", completedAt: hoursAgo(60) },

async function boot(){
  // Render immediately so the UI is never blank while Firestore connects
  // (or fails to, if firebaseConfig hasn't been filled in yet, or the SDK
  // couldn't load at all).
  render();

  if(!FIREBASE_AVAILABLE || !FIREBASE_CONFIGURED){
    console.warn("Running with local seed data only — Firebase is either unavailable or still using placeholder config. Nothing will persist.");
    if(state.clients.length===0){
      const demo = seedDemoData();
      state.clients = demo.clients;
      state.tasks = demo.tasks;
      state.timeEntries = demo.timeEntries;
    }
  } else {
    try{
      state.settings = await ensureSettings();
    }catch(err){
      console.warn("Could not load settings from Firestore, using local seed data:", err);
      state.firebaseError = state.firebaseError || err.message;
    }
    // Data still updates in the background even with a modal open (so it's
    // fresh the moment it closes) -- it just skips forcing a re-render while
    // one's open, since a background sync mid-form-fill would otherwise wipe
    // out anything typed into a field that's since been tabbed away from
    // (those values only live in the DOM until Save, nothing holds them
    // through a full re-render except the currently-focused field).
    subscribe("clients", items=>{ state.clients = items; pruneExpiredSignedDocs(); if(!state.modal) render(); });
    subscribe("tasks", items=>{ state.tasks = items; if(!state.modal) render(); });
    subscribe("timeEntries", items=>{ state.timeEntries = items; if(!state.modal) render(); });
    watchOrientationSync();
  }

  render();
  setInterval(()=>{ if(!state.modal) render(); }, 60000); // refresh live timers every minute, but not mid-form
  setInterval(checkClockReminders, 30*60*1000); // 30-min reminder
}

// ---- 6. Orientation sync (existing integration, preserved) ----
// Extracts Y/M/D directly from the string wherever possible instead of
// round-tripping through a Date object — new Date(string) parses "M/D/YY"
// as LOCAL time but a bare "YYYY-MM-DD" as UTC, so any single post-parse
// conversion (like toISOString) is only correct for one of those two shapes
// and silently shifts the other by a day in some timezones.
function parseLooseDate(str){
  if(!str || typeof str !== "string" || !str.trim()) return null;
  const s = str.trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/);
  if(m){
    const yr = m[3].length===2 ? 2000+parseInt(m[3],10) : parseInt(m[3],10);
    return `${yr}-${String(parseInt(m[1],10)).padStart(2,'0')}-${String(parseInt(m[2],10)).padStart(2,'0')}`;
  }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  const d = new Date(s);
  if(isNaN(d.getTime())) return null;
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function mapMembershipTierToPackage(membershipTier, homeReset){
  const text = ((membershipTier||"") + " " + (homeReset||"")).toLowerCase();
  if(!text.trim()) return null;
  if(text.includes("refresh")) return PACKAGE_TIERS.find(t=>t.key==="reset_refresh");
  if(text.includes("restore")) return PACKAGE_TIERS.find(t=>t.key==="reset_restore");
  const hourMatch = text.match(/(\d+)\s*hr/);
  if(hourMatch) return PACKAGE_TIERS.find(t=>t.hours===parseInt(hourMatch[1],10)) || null;
  return null;
}
function mapAgreementTypeToTermType(agreementType){
  const text = (agreementType||"").toLowerCase();
  if(!text.trim()) return null;
  if(text.includes("pilot") || text.includes("1 month") || text.includes("one (1) month")) return "pilot";
  if(text.includes("three") || text.includes("3 month") || text.includes("3-month")) return "3month";
  if(text.includes("twelve") || text.includes("12 month") || text.includes("1 year") || text.includes("annual")) return "12month_new";
  return null;
}
// Appends a synced value onto an existing free-text field instead of
// clobbering it, and no-ops if there's nothing new to add.
function appendIfNew(existing, label, value){
  if(!value || !value.trim()) return existing;
  const tag = `${label}: ${value.trim()}`;
  if(existing && existing.includes(tag)) return existing;
  return existing ? existing + "\n" + tag : tag;
}
function watchOrientationSync(attempt){
  attempt = attempt || 0;
  db.collection("orientationClients").where("done.visit","==",true)
    .onSnapshot(snap=>{
      snap.docChanges().forEach(change=>{
        if(change.type === "added" || change.type === "modified"){
          const data = change.doc.data();
          const clientName = data.clientName || data.name;
          const match = state.clients.find(c => c.name && clientName &&
            c.name.toLowerCase() === clientName.toLowerCase());
          if(!match) return;

          let notes = match.notes || [];
          const patch = {};
          let notesChanged = false;
          if(!notes.some(n=>n.source==="orientation-sync")){
            notes = [...notes, {
              id: newId("note"),
              text: "Home orientation completed (synced from onboarding dashboard).",
              date: new Date().toISOString(),
              source: "orientation-sync"
            }];
            notesChanged = true;
          }
          // The orientation form's birthdays/special-dates field is free
          // text (e.g. "Spouse birthday - 8/2"), while the app's own
          // specialDates need individual label+date entries to recur
          // yearly — drop it in as its own note so it's visible and
          // actionable instead of trying to auto-parse it.
          const f0 = data.fields || {};
          if(f0.specialDatesNotes && f0.specialDatesNotes.trim() && !notes.some(n=>n.source==="orientation-sync-dates")){
            notes = [...notes, {
              id: newId("note"),
              text: "Birthdays/special dates from orientation (add these individually under Special Dates): " + f0.specialDatesNotes.trim(),
              date: new Date().toISOString(),
              source: "orientation-sync-dates"
            }];
            notesChanged = true;
          }
          if(notesChanged) patch.notes = notes;

          // Contract dates + term — only fill in what's still blank, and
          // setting the start date also sets the renewal anchor to match,
          // same as the manual entry path.
          const startDate = !match.termStartDate ? (parseLooseDate(data.contractStartDate) || parseLooseDate(data.sigDate)) : null;
          if(startDate){
            patch.termStartDate = startDate;
            if(!match.renewalDate) patch.renewalDate = startDate;
          }
          if(!match.termType){
            const termType = mapAgreementTypeToTermType(data.agreementType);
            if(termType) patch.termType = termType;
          }
          if(match.packageHours == null){
            const tier = mapMembershipTierToPackage(data.membershipTier, data.homeReset);
            if(tier){ patch.packageHours = tier.hours; patch.packagePrice = tier.price; }
          }

          // Vendors from the onboarding intake — their "type" field is
          // actually the vendor's name/who, "notes" is what they do.
          if(!(match.vendors||[]).length && (data.vendors||[]).some(v=>v && v.type)){
            patch.vendors = (data.vendors||[]).filter(v=>v && v.type).map(v=>({
              name: v.type, service: (v.notes||"") + (v.schedule ? ` (${v.schedule})` : ""), lastService: ""
            }));
          }

          // Home/business intake questionnaire — folded into the matching
          // free-text profile fields rather than forced into structured
          // ones (the source is loose prose, not clean per-field data).
          const f = data.fields || {};
          const profile = { ...(match.profile||{}) };
          let profileChanged = false;
          const fold = (profileKey, ...sourcePairs) => {
            let val = profile[profileKey] || "";
            const before = val;
            sourcePairs.forEach(([label, srcVal]) => { val = appendIfNew(val, label, srcVal); });
            if(val !== before){ profile[profileKey] = val; profileChanged = true; }
          };
          if(f.support_home || f.support_business || f.support_both){
            const serviceType = f.support_both ? "both" : f.support_business ? "business" : "home";
            if(!match.profile || !match.profile.serviceType){ profile.serviceType = serviceType; profileChanged = true; }
          }
          fold("homeAccess", ["WiFi", f.home_wifi], ["Alarm/entry", f.home_entry], ["Alarm code", f.home_alarm], ["Parking", f.home_parking], ["Garage", f.home_garage]);
          fold("weeklySchedule", ["Household routine", f.hh_routine], ["Work schedule", f.hh_work], ["School", f.hh_school]);
          fold("petInfo", ["Pets", f.home_pets]);
          fold("specialPreferences", ["Preferences", f.prefs_notes], ["Family", f.hh_family]);
          fold("officeAddress", ["Business address", f.biz_address]);
          fold("businessTools", ["Systems", f.biz_systems], ["Logins", f.biz_login]);
          fold("teamMembers", ["Contacts", f.biz_contacts]);
          // These fields now share the exact same name on both sides (the
          // orientation form was rebuilt to match), so it's a direct
          // fill-in-if-blank copy instead of folding into another field.
          const direct = (profileKey, srcVal) => {
            if(srcVal && srcVal.trim && srcVal.trim() && !profile[profileKey]){ profile[profileKey] = srcVal.trim(); profileChanged = true; }
            else if(srcVal && typeof srcVal !== "string" && !profile[profileKey]){ profile[profileKey] = srcVal; profileChanged = true; }
          };
          direct("phone", f.phone);
          direct("emergencyContact", f.emergencyContact);
          direct("homeAddress", f.homeAddress);
          direct("officeHours", f.officeHours);
          direct("businessNeeds", f.businessNeeds);
          direct("communicationPreference", f.communicationPreference);
          direct("budgetNotes", f.budgetNotes);
          direct("offLimits", f.offLimits);
          if(!profile.topPriorities && (f.topPriority1 || f.topPriority2 || f.topPriority3)){
            profile.topPriorities = [f.topPriority1||"", f.topPriority2||"", f.topPriority3||""];
            profileChanged = true;
          }
          if(profileChanged) patch.profile = profile;

          if(Object.keys(patch).length) upsert("clients", match.id, patch);
        }
      });
    }, err=>{
      console.warn("orientation sync listener error, reconnecting:", err);
      if(err.code === "permission-denied") return;
      const delay = Math.min(5000 * Math.pow(2, attempt), 120000);
      setTimeout(()=>watchOrientationSync(attempt+1), delay);
    });
}

// ---- 8. Billing period + tier alerts ----
// A bare "YYYY-MM-DD" string (from every <input type="date">) parses as UTC
// midnight per the JS spec, but every display of it calls toLocaleDateString/
// getMonth/getDate, which convert to the LOCAL timezone — in any US timezone
// that silently shows one calendar day earlier than what was actually
// entered. Use this for every date-only field (renewalDate, termStartDate,
// dueDate, nextDue, lastService, etc.) instead of new Date(str) directly.
function parseYMD(str){
  if(!str) return null;
  const parts = String(str).slice(0,10).split("-").map(Number);
  if(parts.length!==3 || parts.some(isNaN)) return new Date(str);
  return new Date(parts[0], parts[1]-1, parts[2]);
}
// The inverse: a full ISO datetime (e.g. a task's completedAt) needs to
// populate a bare <input type="date">, which reads/writes "YYYY-MM-DD" in
// LOCAL terms. Slicing the ISO string directly grabs the UTC calendar date
// instead, which is wrong whenever the local timezone crosses midnight
// relative to UTC (i.e. always, in the US) — this converts to local first.
function toLocalDateInputValue(iso){
  if(!iso) return "";
  const d = new Date(iso);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
const CYCLE_LABELS = { biweekly:"Every 14 days", monthly:"Every 30 days", quarterly:"Every 90 days", annual:"Annual" };
function cycleLabel(cycleType){ return CYCLE_LABELS[cycleType||"monthly"] || cycleType; }
function currentBillingPeriod(client, refDate){
  if(!client.renewalDate) return null;
  const anchor = parseYMD(client.renewalDate);
  const cycle = client.cycleType || "monthly";
  const now = refDate || new Date();
  let periodStart = new Date(anchor);
  const advance = (d)=>{
    const nd = new Date(d);
    if(cycle==="biweekly") nd.setDate(nd.getDate()+14);
    else if(cycle==="quarterly") nd.setMonth(nd.getMonth()+3);
    else if(cycle==="annual") nd.setFullYear(nd.getFullYear()+1);
    else nd.setDate(nd.getDate()+30); // "monthly" = a strict 30-day cycle, not calendar-month (default)
    return nd;
  };
  while(advance(periodStart) <= now) periodStart = advance(periodStart);
  const periodEnd = advance(periodStart);
  return { start: periodStart, end: periodEnd };
}
// The billing period immediately before the current one — lets a report be
// pulled for last month even after the client has already rolled into a new
// period, e.g. catching up on a recap that didn't get sent in time.
function previousBillingPeriod(client){
  const current = currentBillingPeriod(client);
  if(!current) return null;
  // If the current period's start IS the renewal anchor itself, this is the
  // client's very first cycle — there's no real period before it. Without
  // this check, walking back from current.start-1ms lands back on the
  // anchor (nothing to advance past) and silently returns the SAME period
  // as "last period," which looks like a duplicate/overlapping window.
  if(current.start.getTime() === parseYMD(client.renewalDate).getTime()) return null;
  return currentBillingPeriod(client, new Date(current.start.getTime()-1));
}
// A one-off grant of extra hours into a specific upcoming period (e.g. "let
// this client carry over 6.5 unused hours into their period starting 7/18")
// — tied to that exact period's start date so it doesn't silently keep
// applying to every period after that one.
// `extraHours` is the same idea but for paid add-on hours purchased mid-period
// (e.g. a client buying 20 more hours because they're about to run out) —
// each entry only counts once `paid` is checked, so hours a client hasn't
// actually paid for yet don't inflate their package.
function effectivePackageHours(client){
  let total = client.packageHours || 0;
  const period = currentBillingPeriod(client);
  if(!period) return total;
  const periodStartDate = period.start.toISOString().slice(0,10);
  if(client.rolloverHours && client.rolloverPeriodStart===periodStartDate) total += client.rolloverHours;
  (client.extraHours||[]).forEach(e=>{
    if(e.paid && e.periodStart===periodStartDate) total += (e.hours||0);
  });
  return total;
}
function hoursUsed(clientId){
  const client = state.clients.find(c=>c.id===clientId);
  const period = client ? currentBillingPeriod(client) : null;
  return state.timeEntries
    .filter(t=>t.clientId===clientId)
    .filter(t=> !period || (new Date(t.clockIn) >= period.start && new Date(t.clockIn) < period.end))
    .reduce((sum,t)=> sum + entryDurationHours(t), 0);
}
function tierAlert(client){
  const used = hoursUsed(client.id);
  const pkg = effectivePackageHours(client);
  if(!pkg) return null;
  const pct = (used / pkg) * 100;
  const hit = TIER_THRESHOLDS.filter(t=>pct>=t).pop();
  if(!hit) return null;
  const level = hit>=100 ? "danger" : hit>=90 ? "danger" : hit>=75 ? "warn" : "warn";
  const overage = overageFor(client);
  return { pct: Math.round(pct), used: used.toFixed(1), pkg, level,
    text: client.name + " is at " + Math.round(pct) + "% of package (" + used.toFixed(1) + "/" + pkg + " hrs)" +
      (overage.overHours>0 ? " — $" + overage.amount.toFixed(2) + " overage" : "") };
}
// Client-to-client referral program (distinct from the assistant referral
// payout above): a client who refers another client earns 20% off one month
// once that referral signs a 3-month+ term (not still in the pilot).
function clientReferralDiscountStatus(client){
  const referredClients = state.clients.filter(c=>c.referredByClientId===client.id);
  const qualified = referredClients.filter(c=>c.termType && c.termType!=="pilot");
  const redeemed = client.referralDiscountsRedeemed || 0;
  return { referredClients, earned: qualified.length, redeemed, available: Math.max(0, qualified.length - redeemed) };
}
function redeemClientReferralDiscount(clientId){
  const client = state.clients.find(c=>c.id===clientId);
  if(!client) return;
  upsert("clients", clientId, { referralDiscountsRedeemed: (client.referralDiscountsRedeemed||0) + 1 });
}
function overageFor(client){
  const used = hoursUsed(client.id);
  const pkg = effectivePackageHours(client);
  const overHours = Math.max(0, used - pkg);
  return { overHours, amount: overHours * OVERAGE_RATE };
}

// ---- 8b. Payroll period + dashboard helpers ----
// Payroll runs semi-monthly: the 1st–14th, and the 15th–end of month.
function currentPayrollPeriod(refDate){
  const now = refDate || new Date();
  const year = now.getFullYear(), month = now.getMonth();
  if(now.getDate() <= 14){
    return { start: new Date(year, month, 1), end: new Date(year, month, 15) };
  }
  return { start: new Date(year, month, 15), end: new Date(year, month+1, 1) };
}
function previousPayrollPeriod(){
  const current = currentPayrollPeriod();
  return currentPayrollPeriod(new Date(current.start.getTime()-1));
}
const PAYROLL_FILTER_PRESETS = [
  ["period","This pay period"], ["lastPeriod","Last pay period"],
  ["last30","Last 30 days"], ["lastMonth","Last calendar month"], ["ytd","Year to date"]
];
function payrollFilterPeriod(){
  const preset = state.payrollFilter.preset;
  const now = new Date();
  if(preset==="lastPeriod") return previousPayrollPeriod();
  if(preset==="last30") return { start: new Date(now.getTime()-30*86400000), end: now };
  if(preset==="lastMonth") return { start: new Date(now.getFullYear(), now.getMonth()-1, 1), end: new Date(now.getFullYear(), now.getMonth(), 1) };
  if(preset==="ytd") return { start: new Date(now.getFullYear(), 0, 1), end: now };
  return currentPayrollPeriod();
}
function setPayrollFilterPreset(val){ state.payrollFilter.preset = val; render(); }
function setPayrollReportPeriod(val){ state.payrollReportPeriod = val; render(); }
function resolvedPayrollReportPeriod(){
  return state.payrollReportPeriod === "lastPeriod" ? previousPayrollPeriod() : currentPayrollPeriod();
}
function setPayrollFilterAssistant(val){ state.payrollFilter.assistantId = val; render(); }
function togglePayrollAdminOnly(checked){ state.payrollFilter.adminOnly = checked; render(); }
function hoursInPeriod(entries, period){
  return entries
    .filter(e => !period || (new Date(e.clockIn) >= period.start && new Date(e.clockIn) < period.end))
    .reduce((sum,e)=> sum + entryDurationHours(e), 0);
}
function hoursForClientInPeriod(clientId, period){
  return hoursInPeriod(state.timeEntries.filter(t=>t.clientId===clientId), period);
}
const CLIENT_HOURS_FILTER_PRESETS = [
  ["week","Last 7 days"], ["twoWeeks","Last 14 days"], ["days30","Last 30 days"],
  ["period","Current billing period"], ["all","All time"]
];
function clientHoursFilterPeriod(client){
  const preset = state.clientHoursFilter.preset;
  const now = new Date();
  if(preset==="twoWeeks") return { start: new Date(now.getTime()-14*86400000), end: now };
  if(preset==="days30") return { start: new Date(now.getTime()-30*86400000), end: now };
  if(preset==="period") return currentBillingPeriod(client);
  if(preset==="all") return null;
  return { start: new Date(now.getTime()-7*86400000), end: now };
}
function setClientHoursFilterPreset(val){ state.clientHoursFilter.preset = val; render(); }
// period.end is an exclusive boundary (midnight of the day AFTER the period)
// so it's one day past the period's actual last day — always subtract 1ms
// before formatting for display, or "7/15–7/31" reads as "7/15–8/1".
function formatPeriodRange(period){
  if(!period) return "";
  const displayEnd = new Date(period.end.getTime()-1);
  return period.start.toLocaleDateString() + " – " + displayEnd.toLocaleDateString();
}
function assistantName(id){
  const a = state.settings.assistants.find(x=>x.id===id);
  return a ? a.name : id;
}

// ---- 8c. Weekly client report (Saturday through Friday) ----
function currentReportWeek(refDate){
  const now = refDate || new Date();
  const daysSinceFriday = (now.getDay() - 5 + 7) % 7; // Friday = 5
  const friday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - daysSinceFriday);
  const start = new Date(friday.getFullYear(), friday.getMonth(), friday.getDate() - 6); // Saturday before
  const end = new Date(friday.getFullYear(), friday.getMonth(), friday.getDate() + 1); // exclusive, midnight after Friday
  return { start, end, friday };
}
function formatHoursMinutes(hrs){
  const totalMinutes = Math.round(Math.max(0,hrs) * 60);
  return Math.floor(totalMinutes/60) + "h " + (totalMinutes % 60) + "m";
}
// Receipts live as regular task attachments (however Rachel already uploads
// them) — this just gathers whichever ones were uploaded during the report
// window, across all of the client's tasks, rather than only from tasks that
// happened to be completed in that window (a receipt can land on a task
// that's still open, or one from before the window).
function receiptsInWindow(client, window){
  const receipts = [];
  state.tasks.filter(t=>t.clientId===client.id).forEach(t=>{
    (t.attachments||[]).forEach(a=>{
      const uploaded = new Date(a.uploadedAt);
      if(uploaded >= window.start && uploaded < window.end){
        receipts.push({ ...a, taskTitle: t.title });
      }
    });
  });
  return receipts.sort((a,b)=> new Date(a.uploadedAt) - new Date(b.uploadedAt));
}
// kind: "week" (the Friday recap, Saturday–Friday), "period" (the client's
// current billing cycle), or "lastPeriod" (the cycle just before that, for
// catching up on a recap that didn't go out in time) — all three share the
// same layout, just a different task-completion window and labels. For any
// "period"-flavored kind, hours used/remaining are scoped to that specific
// window instead of always "right now" — otherwise a last-period recap would
// show this period's usage, which doesn't match what it's reporting on.
function buildClientReport(client, window, kind){
  const tasks = state.tasks.filter(t=>t.clientId===client.id);
  const inProgress = tasks.filter(t=>t.status==="In progress");
  const completed = tasks.filter(t=>{
    if(t.status!=="Done" || !t.completedAt) return false;
    const d = new Date(t.completedAt);
    return d >= window.start && d < window.end;
  });
  const isPeriodKind = kind==="period" || kind==="lastPeriod";
  const used = isPeriodKind ? hoursForClientInPeriod(client.id, window) : hoursUsed(client.id);
  const pkg = effectivePackageHours(client);
  return {
    kind, client, week: window, inProgress, completed,
    hoursUsed: used, packageHours: pkg,
    hoursRemaining: Math.max(0, pkg - used),
    billingPeriod: isPeriodKind ? window : currentBillingPeriod(client),
    signerName: "The Modern Concierge Team",
    receipts: client.includeReceiptsInReport ? receiptsInWindow(client, window) : []
  };
}

// The short message used both as "Email client"'s mailto body and as the

function clientReportCoverNote(report){

    + "Please let me know if you have any questions regarding this report.\n\n"

function copyReportCoverNote(clientId, kind, btnEl){

function csvEscape(val){
  const s = String(val==null ? "" : val);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function downloadCsv(filename, rows){
  const csv = rows.map(row=>row.map(csvEscape).join(",")).join("\n");
  const blob = new Blob([csv], { type:"text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// ---- 8f. Payroll report (per assistant, same branded format) ----
function buildPayrollReport(assistant, period){
  const entries = state.timeEntries.filter(e=>e.assistantId===assistant.id);
  const inPeriod = entries.filter(e => new Date(e.clockIn) >= period.start && new Date(e.clockIn) < period.end);
  const totalHours = inPeriod.reduce((s,e)=>s+entryDurationHours(e),0);
  const byClientMap = {};
  inPeriod.forEach(e=>{
    const name = e.clientId===INTERNAL_CLIENT_ID ? "Internal / Modern Co." : (state.clients.find(c=>c.id===e.clientId)?.name || "Unknown client");
    byClientMap[name] = (byClientMap[name]||0) + entryDurationHours(e);
  });
  const byClient = Object.entries(byClientMap).map(([name,hours])=>({name,hours})).sort((a,b)=>b.hours-a.hours);
  const rate = assistant.hourlyRate || 0;
  return { assistant, period, totalHours, byClient, rate, amountOwed: totalHours*rate };
}

function payrollReportPlainText(report){
  const { assistant, period, byClient } = report;
  const fmt = d => new Date(d).toLocaleDateString();
  const lines = [];
  lines.push("Payroll Recap — " + assistant.name);
  lines.push(fmt(period.start) + " – " + fmt(new Date(period.end.getTime()-1)));
  lines.push("");
  lines.push("HOURS BY CLIENT:");
  lines.push(...(byClient.length ? byClient.map(c=>"- "+c.name+": "+formatHoursMinutes(c.hours)) : ["(no hours logged this period)"]));
  lines.push("");
  lines.push("HOURS WORKED: " + formatHoursMinutes(report.totalHours));
  lines.push("HOURLY RATE: $" + report.rate.toFixed(2));
  lines.push("TOTAL PAY: $" + report.amountOwed.toFixed(2));
  lines.push("");
  lines.push("Questions about your hours or pay this period, just ask.");
  lines.push("");
  lines.push("The Modern Concierge");
  return lines.join("\n");
}
function downloadPayrollReport(assistantId){
  const assistant = state.settings.assistants.find(a=>a.id===assistantId);
  if(!assistant) return;
  const period = resolvedPayrollReportPeriod();
  const report = buildPayrollReport(assistant, period);
  const blob = new Blob([payrollReportHtml(report)], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = assistant.name.replace(/[^a-z0-9]+/gi,"-") + "-payroll-" + new Date().toISOString().slice(0,10) + ".html";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function emailPayrollReport(assistantId){

  if(!assistant) return;

// Active assistants, plus any former employee already tied to this record —
// so an existing assignment to someone who's left stays visible for context.
function assignableAssistants(alreadyIds){
  const already = new Set(alreadyIds||[]);
  return state.settings.assistants.filter(a=>a.active!==false || already.has(a.id));
}
// A client's package hours are quoted on their own (monthly/quarterly/annual)
// billing cycle, not on the semi-monthly payroll calendar. To compare what a
// client paid for against what got clocked in a given payroll period, prorate
// their package down to a per-payroll-period rate (2 payroll periods/month).
// A biweekly cycle (14 days) is roughly the same length as one payroll
// period already, so it needs no further proration (divisor 1).
function payrollProrationDivisor(cycle){
  if(cycle === "biweekly") return 1;
  if(cycle === "quarterly") return 6;
  if(cycle === "annual") return 24;
  return 2; // monthly (default)
}
function expectedHoursPerPayrollPeriod(client){
  const pkg = client.packageHours || 0;
  return pkg / payrollProrationDivisor(client.cycleType || "monthly");
}
// Same proration logic as hours, applied to package price — packagePrice is
// quoted on the client's own billing cycle, not the payroll calendar.
function expectedRevenuePerPayrollPeriod(client){
  const price = client.packagePrice || 0;
  const divisor = payrollProrationDivisor(client.cycleType || "monthly");
  // Overage billing is real revenue too — this also covers as-needed clients
  // (packagePrice 0, packageHours 0) whose entire usage bills as "overage."
  return (price / divisor) + (overageFor(client).amount / divisor);
}
function internalHoursStatus(period){
  const used = hoursForClientInPeriod(INTERNAL_CLIENT_ID, period);
  const budget = state.settings.internalHoursBudget || 0;
  if(!budget) return { used, budget:0, pct:null, level:null };
  const pct = (used/budget)*100;
  const hit = TIER_THRESHOLDS.filter(t=>pct>=t).pop();
  const level = !hit ? "ok" : hit>=90 ? "danger" : "warn";
  return { used, budget, pct: Math.round(pct), level };
}
function taskCreatedDate(task){
  if(task.createdAt){
    const d = new Date(task.createdAt);
    if(!isNaN(d.getTime())) return d;
  }
  const m = /_(\d{10,})_/.exec(task.id||"");
  return m ? new Date(parseInt(m[1],10)) : null;
}
// ---- Referral tracking ----
// Current program: $100/month to the referring assistant for up to 12
// months, but only once the client signs on past their 30-day pilot into a
// paid term — and it stops accruing the moment the client cancels, even if
// that's mid-year.
function referralPayoutStatus(client){
  if(!client.referredBy) return null;
  const assistant = state.settings.assistants.find(a=>a.id===client.referredBy);
  if(!assistant) return null;
  if(!client.termType || client.termType==="pilot"){
    return { assistant, eligible:false, reason:"Still in the 30-day pilot — payouts start once they sign on past it." };
  }
  if(!client.termStartDate){
    return { assistant, eligible:false, reason:"Set a term start date on the Membership tab to calculate payout months." };
  }
  const start = parseYMD(client.termStartDate);
  const stoppedAccruing = client.clientStatus && client.clientStatus!=="active";
  const asOf = (stoppedAccruing && client.cancelledDate) ? parseYMD(client.cancelledDate) : new Date();
  let monthsElapsed = (asOf.getFullYear()-start.getFullYear())*12 + (asOf.getMonth()-start.getMonth()) + 1;
  if(asOf.getDate() < start.getDate()) monthsElapsed--;
  monthsElapsed = Math.max(0, Math.min(12, monthsElapsed));
  const paid = client.referralPayoutsPaidCount || 0;
  return {
    assistant, eligible:true, monthsElapsed, paid,
    owed: Math.max(0, monthsElapsed - paid),
    stoppedEarly: stoppedAccruing,
    monthlyAmount: 100
  };
}
function daysOpen(task){
  const created = taskCreatedDate(task);
  return created ? (Date.now() - created.getTime())/86400000 : null;
}
function overdueTasks(){
  return state.tasks
    .filter(t=>t.status!=="Done")
    .map(t=>({ task:t, days: daysOpen(t) }))
    .filter(x=>x.days!==null && x.days>=7)
    .sort((a,b)=>b.days-a.days);
}
// Distinct from overdueTasks() above: that's "been sitting open a while"
// (staleness); this is "missed an actual deadline" — different signals.
// At-risk: no billable hours this period AND no completed task in the last
// 30 days. Either alone can be normal (a slow week); both together suggests
// the client's quietly gone dormant.
function isAtRiskClient(client){
  if(client.clientStatus && client.clientStatus!=="active") return false; // already known-paused/cancelled, not a surprise risk
  const used = hoursUsed(client.id);
  if(used > 0) return false;
  const thirtyDaysAgo = Date.now() - 30*24*3600000;
  const recentCompleted = state.tasks.some(t=>t.clientId===client.id && t.status==="Done" && t.completedAt && new Date(t.completedAt).getTime() >= thirtyDaysAgo);
  return !recentCompleted;
}
// Flags an active client whose contract term end date has already passed —
// e.g. their 3-month term ended and they were supposed to sign a new term,
// but nobody's gotten around to updating termType/termStartDate to reflect
// it yet. Self-clears the moment the term is actually updated, since that
// pushes termEndDate back into the future.
function needsTermUpdate(client){
  if(client.clientStatus && client.clientStatus!=="active") return false;
  const end = termEndDate(client);
  if(!end) return false;
  return end.getTime() < Date.now();
}
function tasksPastDueDate(){
  const now = new Date();
  return state.tasks
    .filter(t=>t.status!=="Done" && t.dueDate)
    .map(t=>({ task:t, daysLate: -daysUntil(parseYMD(t.dueDate), now) }))
    .filter(x=>x.daysLate > 0)
    .sort((a,b)=>b.daysLate-a.daysLate);
}

// ---- 8g. Upcoming/overdue reminders (special dates, vendors, inspections) ----
function nextYearlyOccurrence(dateStr, now){
  const d = parseYMD(dateStr);
  if(!d || isNaN(d.getTime())) return null;
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let next = new Date(now.getFullYear(), d.getMonth(), d.getDate());
  if(next < todayMid) next = new Date(now.getFullYear()+1, d.getMonth(), d.getDate());
  return next;
}
function daysUntil(date, now){
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((date.getTime() - todayMid.getTime())/86400000);
}
// Signed agreements/contracts keep their full text (and, for clients, the
// signature image) for this many days after signing — long enough to
// download and file externally — then pruneExpiredSignedDocs() clears just
// the heavy fields automatically so they don't sit in Firestore forever.
// The lightweight signed/name/date fields are kept permanently either way,
// as the record that it happened.
const SIGNED_DOC_RETENTION_DAYS = 30;
function daysUntilDocExpiry(signedAtDate){
  if(!signedAtDate) return null;
  const expiresAt = new Date(signedAtDate.getTime() + SIGNED_DOC_RETENTION_DAYS*86400000);
  return daysUntil(expiresAt, new Date());
}
function isDocExpired(signedAtDate){
  if(!signedAtDate) return false;
  const days = daysUntilDocExpiry(signedAtDate);
  return days !== null && days <= 0;
}
function pruneExpiredSignedDocs(){
  let assistantsChanged = false;
  const assistants = state.settings.assistants.map(a=>{
    if(a.agreementSigned && a.agreementHtml && isDocExpired(new Date(a.agreementSignedAt))){
      assistantsChanged = true;
      return { ...a, agreementHtml: null };
    }
    return a;
  });
  if(assistantsChanged){
    state.settings.assistants = assistants;
    upsert("settings","access", { assistants });
  }
  state.clients.forEach(client=>{
    if(client.contractSigned && (client.contractHtml || client.contractSignatureDataUrl) && isDocExpired(parseYMD(client.contractSignedDate))){
      upsert("clients", client.id, { contractHtml:null, contractSignatureDataUrl:null });
    }
  });
}
function upcomingReminders(windowDays){
  windowDays = windowDays || 14;
  const now = new Date();
  const results = [];
  state.clients.filter(c=>c.id!==INTERNAL_CLIENT_ID).forEach(client=>{
    (client.specialDates||[]).forEach(d=>{
      const next = nextYearlyOccurrence(d.date, now);
      if(!next) return;
      const days = daysUntil(next, now);
      if(days <= windowDays) results.push({ client, type:"Special date", label:d.label, date:next, days });
    });
    (client.vendors||[]).forEach(v=>{
      if(!v.lastService || !v.frequencyDays) return;
      const due = new Date(parseYMD(v.lastService).getTime() + v.frequencyDays*86400000);
      const days = daysUntil(due, now);
      if(days <= windowDays) results.push({ client, type:"Vendor service", label: v.name + " — " + v.service, date:due, days });
    });
    (client.inspections||[]).forEach(ins=>{
      if(!ins.nextDue) return;
      const due = parseYMD(ins.nextDue);
      const days = daysUntil(due, now);
      if(days <= windowDays) results.push({ client, type:"Inspection", label: ins.name, date:due, days });
    });
  });
  return results.sort((a,b)=>a.days-b.days);
}

// ---- Term end + cancellation notice deadlines ----
// Per the Services Agreement §2: written notice is required this many days
// before the term ends, or it auto-renews and the card on file gets charged.
const TERM_LENGTH_DAYS = { pilot:30, "3month":90, "12month_new":365, "12month_renewal":365 };
const TERM_NOTICE_DAYS = { pilot:7, "3month":30, "12month_new":60, "12month_renewal":60 };
const TERM_LABELS = { pilot:"One Month Pilot", "3month":"Three Month Term", "12month_new":"Twelve Month Term (New)", "12month_renewal":"Twelve Month Term (Renewal)" };
function termEndDate(client){
  // A manual override always wins — the 30/90/365-day formula is a default,
  // not every real contract lines up with it exactly.
  if(client.termEndOverride) return parseYMD(client.termEndOverride);
  if(!client.termStartDate || !client.termType || !TERM_LENGTH_DAYS[client.termType]) return null;
  return new Date(parseYMD(client.termStartDate).getTime() + TERM_LENGTH_DAYS[client.termType]*24*3600000);
}
function noticeDeadline(client){
  if(client.noticeDeadlineOverride) return parseYMD(client.noticeDeadlineOverride);
  const end = termEndDate(client);
  if(!end) return null;
  return new Date(end.getTime() - (TERM_NOTICE_DAYS[client.termType]||0)*24*3600000);
}
function upcomingNoticeDeadlines(windowDays){
  // windowDays === null means "no limit" — every active client, not just
  // ones whose deadline happens to be imminent. Clients with no term data
  // set yet still show up (with null fields) rather than silently vanishing
  // — that's a "needs setup" case, not a reason to hide them from the list.
  const now = new Date();
  return state.clients
    .filter(c=>c.id!==INTERNAL_CLIENT_ID && (!c.clientStatus || c.clientStatus==="active"))
    .map(client=>{
      const deadline = noticeDeadline(client);
      const period = currentBillingPeriod(client);
      const days = deadline ? daysUntil(deadline, now) : null;
      return { client, deadline, termEnd: termEndDate(client), periodEnd: period ? period.end : null, days };
    })
    .filter(x=>windowDays===null || x.days===null || x.days<=windowDays)
    .sort((a,b)=>(a.days===null?Infinity:a.days)-(b.days===null?Infinity:b.days));
}
// "This week"/"next week" reuse the same Sat–Fri window the weekly client
// reports already use, rather than inventing a second definition of "week".
function nextReportWeek(){
  const week = currentReportWeek();
  return { start: week.end, end: new Date(week.end.getTime() + 7*86400000) };
}
function clientsRenewingInWindow(window){
  return state.clients
    .filter(c=>c.id!==INTERNAL_CLIENT_ID && (!c.clientStatus || c.clientStatus==="active"))
    .map(client=>({ client, end: termEndDate(client) }))
    .filter(x=>x.end && x.end>=window.start && x.end<window.end)
    .sort((a,b)=>a.end-b.end);
}
// Drives the Dashboard "Emails to send" alert — period recaps and renewal
// notices that are due soon (or overdue) and haven't been marked sent yet
// for the specific period/term they're due for. Sending (or copying) either
// one elsewhere in the app clears it from here automatically.
function emailsNeededList(){
  const now = new Date();
  const items = [];
  state.clients.filter(c=>c.id!==INTERNAL_CLIENT_ID && (!c.clientStatus || c.clientStatus==="active")).forEach(client=>{
    const period = currentBillingPeriod(client);
    if(period){
      const periodEndDisplay = new Date(period.end.getTime()-1);
      const daysToEnd = daysUntil(periodEndDisplay, now);
      const sent = client.periodRecapSentForPeriodStart === period.start.toISOString().slice(0,10);
      if(!sent && daysToEnd<=2){
        items.push({ client, type:"period", label:"Send end-of-period recap",
          detail: (daysToEnd<0 ? "period ended " : "period ends ") + periodEndDisplay.toLocaleDateString(), urgent: daysToEnd<0, days: daysToEnd });
      }
    }
    const notice = noticeDeadline(client);
    if(notice && client.termType){
      const daysToNotice = daysUntil(notice, now);
      const sent = client.renewalEmailSentForTermType === client.termType;
      if(!sent && daysToNotice<=7){
        items.push({ client, type:"renewal", label:"Send contract renewal email",
          detail: (daysToNotice<0 ? "notice deadline was " : "notice due ") + notice.toLocaleDateString(), urgent: daysToNotice<0, days: daysToNotice });
      }
    }
  });
  return items.sort((a,b)=>a.days-b.days);
}
function dismissEmailNeeded(clientId, type){
  if(type==="period"){
    const client = state.clients.find(c=>c.id===clientId);
    const period = currentBillingPeriod(client);
    if(period) markPeriodRecapSent(clientId, period);
  } else {
    const client = state.clients.find(c=>c.id===clientId);
    markRenewalEmailSent(clientId, client.termType);
  }
}

// ---- 10. Rendering ----
const app = document.getElementById("app");

function render(){
  // A full re-render happens constantly in the background (the 60s live-timer
  // tick, any Firestore snapshot from anyone's activity) and always rebuilds
  // the whole page from `state`. Since a text field's typed characters don't
  // land in `state` until it's blurred (onchange), a refresh mid-keystroke
  // would otherwise wipe back to the last-saved value. Capture + restore
  // whatever's actively focused so typing survives a background refresh.
  const active = document.activeElement;
  const preserving = active && (active.tagName === "TEXTAREA" || (active.tagName === "INPUT" && (active.type === "text" || active.type === "number" || active.type === "email" || active.type === "search")));
  const preserved = preserving ? { id: active.id, value: active.value, selStart: active.selectionStart, selEnd: active.selectionEnd } : null;
  // Every re-render rebuilds the page from scratch, which resets scroll to
  // the top — so clicking anything below the fold (mark a comment seen,
  // check off a subtask, clock out, etc.) yanks you back up. Restore
  // wherever you were scrolled to, same idea as the focus-preservation above.
  const prevScrollEl = document.querySelector(".main");
  const prevScrollTop = prevScrollEl ? prevScrollEl.scrollTop : 0;

  if(state.view === "login") renderLogin();
  else if(state.role === "client") renderClientPortal();
  else renderAppShell();

  if(preserved && preserved.id){
    const el = document.getElementById(preserved.id);
    if(el){
      el.value = preserved.value;
      el.focus();
      try{ el.setSelectionRange(preserved.selStart, preserved.selEnd); }catch(e){}
    }
  }
  const newScrollEl = document.querySelector(".main");
  if(newScrollEl && prevScrollTop) newScrollEl.scrollTop = prevScrollTop;

  // The signature <canvas> only exists in the DOM while a client's Service
  // Agreement section is open and unsigned — (re)bind to it on every render
  // since render() always rebuilds the DOM from scratch, which would
  // otherwise orphan the old canvas's event listeners.
  if(state.selectedClientId){
    const canvas = document.getElementById('sigPad_'+state.selectedClientId);
    if(canvas) initClientSigPad(state.selectedClientId);
  }
}

// needs to look at and accept or decline — it is NOT an admin sign-off queue.
// This card is shared by the admin dashboard (sees every pending request) and

function renderClientRequestsCard(tasks, opts){
  opts = opts || {};
  if(!tasks.length) return "";
  return `
    <div class="card">
      <h3>${opts.title || "Client requests awaiting review"}</h3>
      ${tasks.map(t=>{
        const client = state.clients.find(c=>c.id===t.clientId);
        return `<div class="list-item" style="flex-direction:column;align-items:stretch;gap:6px;">
          <div class="flex-between">
            <div>
              <span class="badge ${t.category==='Home'?'home':'business'}">${t.category||'—'}</span>
              <strong>${t.title}</strong>
              <span class="small">(${client?client.name:'Internal'})</span>
              ${opts.showAssistant ? `<span class="small"> · ${(t.assignees||[]).map(assistantName).join(', ') || 'unassigned'}</span>` : ""}
            </div>
            <div style="display:flex;gap:6px;">
              <button onclick="acceptClientRequest('${t.id}')">Accept</button>
              <button class="danger" onclick="declineClientRequest('${t.id}')">Decline</button>
            </div>
          </div>
          ${t.clientRequestNote ? `<div class="small">&ldquo;${t.clientRequestNote}&rdquo;</div>` : ""}
          ${t.requestImage ? `<img src="${t.requestImage}" style="max-width:160px;max-height:160px;border-radius:8px;cursor:pointer;" onclick="openTaskEditor('${t.id}',null)">` : ""}
        </div>`;
      }).join("")}
    </div>
  `;
}
function acceptClientRequest(taskId){
  const task = state.tasks.find(t=>t.id===taskId);
  if(!task) return;
  upsert("tasks", taskId, { status: "To do" });
  // Update the in-memory copy too, not just Firestore — the write above
  // won't reflect back into state.tasks until the next snapshot arrives,
  // and opening the editor immediately after would otherwise show (and on
  // Save, re-save) the old "Pending approval" status.
  task.status = "To do";
  // Open it straight away so accepting doesn't just make the card vanish —
  // whoever accepted it can immediately see what it actually is, adjust
  // assignees/due date/etc. without having to go hunt for it afterward.
  openTaskEditor(taskId, null);
}
function declineClientRequest(taskId){
  const task = state.tasks.find(t=>t.id===taskId);
  if(!task) return;
  // A pending-approval request shouldn't normally have any clock-ins yet,
  // but guard it anyway — same rule as deleteTask(): a time entry can't
  // outlive the task it belongs to.
  const entries = state.timeEntries.filter(e=>e.taskId===taskId);
  if(entries.length > 0 && !confirm(`This request already has ${formatHoursMinutes(hoursForTask(taskId))} clocked into it. Declining it will delete that time too. Continue?`)) return;
  const reason = prompt("Reason for declining (shared with the client in their activity log):", "");
  if(reason === null) return;
  const client = state.clients.find(c=>c.id===task.clientId);
  if(client){
    const notes = client.notes || [];
    upsert("clients", client.id, { notes: [...notes, {
      id: newId("note"),
      text: "Your request \"" + task.title + "\" couldn't be taken on" + (reason.trim() ? ": " + reason.trim() : "."),
      date: new Date().toISOString(),
      source: "task-declined"
    }] });
  }
  entries.forEach(e=>remove("timeEntries", e.id));
  remove("tasks", taskId);
  render();
}

function renderTeamDashboard(){
  const myClientIds = new Set(state.clients.filter(c=>(c.assistantIds||[]).includes(state.currentAssistant?.id)).map(c=>c.id));
  const alerts = state.clients.filter(c=>myClientIds.has(c.id)).map(tierAlert).filter(Boolean);
  const myEntry = state.currentAssistant && activeEntryFor(state.currentAssistant.id);
  const myOpenTasks = state.tasks.filter(t=>t.status!=="Done" && (t.assignees||[]).includes(state.currentAssistant?.id));
  const myPending = state.tasks.filter(t=>t.status==="Pending approval" && (t.assignees||[]).includes(state.currentAssistant?.id));

  // Week ahead: anything flagged priority, plus anything due in the next 7
  // days (or already overdue) — sorted priority-first, then by due date.
  const now = new Date();
  const weekAhead = myOpenTasks.filter(t=>{
    if(t.priority) return true;
    if(!t.dueDate) return false;
    return daysUntil(parseYMD(t.dueDate), now) <= 7;
  }).sort((a,b)=>{
    if(!!b.priority !== !!a.priority) return b.priority ? 1 : -1;
    if(!a.dueDate && !b.dueDate) return 0;
    if(!a.dueDate) return 1;
    if(!b.dueDate) return -1;
    return new Date(a.dueDate) - new Date(b.dueDate);
  });

  // Recent comments across everything assigned to me, newest first.
  const recentComments = myOpenTasks
    .flatMap(t => (t.discussion||[]).map(d => ({ ...d, task: t })))
    .sort((a,b)=> new Date(b.date) - new Date(a.date))
    .slice(0,6);

  return `

const CLIENT_ONBOARDING_COMMON = [

  { id:"home_access_collected", text:"Home access info collected (WiFi, alarm, entry, parking)" },
  { id:"home_vendors_collected", text:"Vendor list collected" }

  { id:"biz_intake_done", text:"Business intake call scheduled or completed" },

  { id:"biz_contacts_collected", text:"Team member contacts collected" }

// Reuses the same "Client type" field the Profile tab already has (home /
// business / both) — Susan-style clients who need both just have both sets
// show up, nothing separate to configure.
function clientOnboardingItems(client){
  const serviceType = (client.profile && client.profile.serviceType) || "home";
  let items = CLIENT_ONBOARDING_COMMON.slice();
  if(serviceType==="home" || serviceType==="both") items = items.concat(CLIENT_ONBOARDING_HOME);
  if(serviceType==="business" || serviceType==="both") items = items.concat(CLIENT_ONBOARDING_BUSINESS);
  return items;
}
function renderClientOnboardingChecklist(client){
  const items = clientOnboardingItems(client).map(i=>{
    const saved = (client.onboardingChecklist||[]).find(x=>x.id===i.id);
    return { ...i, done: saved ? saved.done : false };
  });
  const doneCount = items.filter(i=>i.done).length;
  const assistantAssigned = (client.assistantIds||[]).length > 0;
  const portalCodeSet = !!client.portalCode;
  const serviceType = (client.profile && client.profile.serviceType) || "home";
  return `
    <div class="card">
      <div class="flex-between"><h3>Onboarding checklist</h3><span class="small">${doneCount}/${items.length} done</span></div>
      <div class="small" style="margin-bottom:6px;">Home/business steps shown below are based on "Client type" further down — currently <strong>${serviceType}</strong>. Set it to "Both" for a client like Susan who needs both.</div>
      <div class="checklist-item"><span class="small">${assistantAssigned ? '✅' : '⬜'} Assistant assigned ${assistantAssigned ? '— '+((client.assistantIds||[]).map(assistantName).join(', ')) : '(set on Membership tab)'}</span></div>
      <div class="checklist-item"><span class="small">${portalCodeSet ? '✅' : '⬜'} Client portal code set ${portalCodeSet ? '' : '(set on Membership tab)'}</span></div>
      <div class="checklist-item"><span class="small">${client.contractSigned ? '✅' : '⬜'} Contract signed ${client.contractSigned ? '— by '+client.contractSignedName : '(sign it on the Service Agreement section below)'}</span></div>
      ${items.map(i=>`
        <div class="checklist-item">
          <input type="checkbox" id="cob_${client.id}_${i.id}" ${i.done?'checked':''} onchange="toggleClientOnboardingItem('${client.id}','${i.id}')">
          <label for="cob_${client.id}_${i.id}">${i.text}</label>
        </div>`).join("")}
    </div>
  `;
}
function toggleClientOnboardingItem(clientId, itemId){
  const client = state.clients.find(c=>c.id===clientId);
  if(!client) return;
  const items = clientOnboardingItems(client).map(i=>{
    const saved = (client.onboardingChecklist||[]).find(x=>x.id===i.id);
    return { id:i.id, done: saved ? saved.done : false };
  });
  const idx = items.findIndex(i=>i.id===itemId);
  items[idx] = { ...items[idx], done: !items[idx].done };
  upsert("clients", clientId, { onboardingChecklist: items });
}

function profileSectionOpen(key){
  return (state.profileOpenSections||new Set()).has(key);
}
function toggleProfileSection(key){
  if(!state.profileOpenSections) state.profileOpenSections = new Set();
  if(state.profileOpenSections.has(key)) state.profileOpenSections.delete(key);
  else state.profileOpenSections.add(key);
  render();
}
function renderProfileSection(key, title, bodyHtml){
  const open = profileSectionOpen(key);
  return `
    <div class="card">
      <div class="flex-between" style="cursor:pointer;" onclick="toggleProfileSection('${key}')">
        <h3 style="margin:0;">${title}</h3>
        <span class="small">${open ? '▾ Hide' : '▸ Show'}</span>
      </div>
      ${open ? `<div style="margin-top:12px;">${bodyHtml}</div>` : ""}
    </div>
  `;
}

// --- Service Agreement + signature (fills the same blanks a human would
// hand-write during orientation — client name, start date, which term is
// selected — everything else in CLIENT_SERVICE_AGREEMENT_HTML is untouched,
// verbatim legal text). The drawn signature below is the same "quick
// in-person acknowledgment" the old Orientation Companion tool used, NOT a
// legally binding e-signature — see the disclaimer rendered with it.
function clientAgreementHtml(client){
  let html = CLIENT_SERVICE_AGREEMENT_HTML;
  const name = (client.name||'').trim() || '_______________';
  html = html.replace('and<br />\n("Client")</p>', 'and<br />\n<strong>'+name+'</strong> ("Client")</p>');
  const startDate = client.termStartDate ? parseYMD(client.termStartDate).toLocaleDateString() : '_______________';
  html = html.replace('<p>Services Start Date:</p>', '<p>Services Start Date: <strong>'+startDate+'</strong></p>');
  const TERM_LINE_MATCH = {
    pilot: '<p>One (1) Month Pilot</p>',
    "3month": '<p>Three (3) Month Term</p>',
    "12month_new": '<p><strong>Twelve (12) Month Term (New)</strong></p>',
    "12month_renewal": '<p>Twelve (12) Month Term (Renewal)</p>'
  };
  const target = TERM_LINE_MATCH[client.termType || 'pilot'];
  if(target){
    html = html.replace(target, target.slice(0,-4) + ' ✓ <strong>(selected)</strong></p>');
  }
  return html;
}

let csSigCanvas=null, csSigCtx=null, csDrawing=false, csHasDrawn=false;
function initClientSigPad(clientId){
  const canvas = document.getElementById('sigPad_'+clientId);
  if(!canvas) { csSigCanvas=null; csSigCtx=null; return; }
  if(csSigCanvas !== canvas){
    csSigCanvas = canvas;
    const pos = (e)=>{
      const rect = csSigCanvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: t.clientX-rect.left, y: t.clientY-rect.top };
    };
    const start = (e)=>{ csDrawing=true; csHasDrawn=true; const p=pos(e); csSigCtx.beginPath(); csSigCtx.moveTo(p.x,p.y); e.preventDefault(); };
    const move = (e)=>{ if(!csDrawing) return; const p=pos(e); csSigCtx.lineTo(p.x,p.y); csSigCtx.stroke(); e.preventDefault(); };
    const end = ()=>{ csDrawing=false; };
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, {passive:false});
    canvas.addEventListener('touchmove', move, {passive:false});
    canvas.addEventListener('touchend', end);
  }
  resizeClientSigCanvas();
}
function resizeClientSigCanvas(){
  if(!csSigCanvas) return;
  const rect = csSigCanvas.getBoundingClientRect();
  if(rect.width===0 || rect.height===0) return;
  const ratio = window.devicePixelRatio || 1;
  csSigCanvas.width = rect.width*ratio;
  csSigCanvas.height = rect.height*ratio;
  csSigCtx = csSigCanvas.getContext('2d');
  csSigCtx.scale(ratio, ratio);
  csSigCtx.strokeStyle = '#241a17';
  csSigCtx.lineWidth = 2.2;
  csSigCtx.lineCap = 'round';
  csHasDrawn = false;
}
function clearSignaturePad(){
  if(!csSigCtx || !csSigCanvas) return;
  csSigCtx.clearRect(0,0,csSigCanvas.width,csSigCanvas.height);
  csHasDrawn = false;
}
function saveClientAgreement(clientId){
  const client = state.clients.find(c=>c.id===clientId);
  if(!client) return;
  const agreeEl = document.getElementById('agree_'+clientId);
  if(!agreeEl || !agreeEl.checked){ alert("Please check the box confirming the client has reviewed and agreed to the terms first."); return; }
  if(!csHasDrawn || !csSigCanvas){ alert("Please have the client draw their signature first."); return; }
  const name = document.getElementById('sigName_'+clientId).value.trim();
  const date = document.getElementById('sigDate_'+clientId).value;
  if(!name || !date){ alert("Client full name and date are required."); return; }
  const signatureDataUrl = csSigCanvas.toDataURL('image/png');
  const contractHtml = clientAgreementHtml(client);
  upsert("clients", clientId, {
    contractSigned: true,
    contractSignedName: name,
    contractSignedDate: date,
    contractSignatureDataUrl: signatureDataUrl,
    contractHtml
  });
}
function resetClientAgreement(clientId){
  if(!confirm("Clear this signature so the client can re-sign? This can't be undone.")) return;
  upsert("clients", clientId, { contractSigned:false, contractSignedName:null, contractSignedDate:null, contractSignatureDataUrl:null, contractHtml:null });
}

// browser's Print > Save as PDF if what's needed is a PDF for QuickBooks.
function downloadClientContract(clientId){

<style>body{font-family:Georgia,serif;max-width:720px;margin:40px auto;padding:0 20px;color:#241a17;line-height:1.5;} .sig-block{margin-top:30px;padding-top:16px;border-top:1px solid #ccc;} img{max-width:280px;display:block;margin-top:8px;}</style>

// pick, a per-assistant breakdown (so admin can see who worked how much,
// and assistants can see teammates covering the same client), and send the
// weekly/period client recap themselves instead of only from the admin-only
// Reports tab.
function renderClientHoursCard(client){
  const chf = state.clientHoursFilter;
  const period = clientHoursFilterPeriod(client);
  const periodLabel = CLIENT_HOURS_FILTER_PRESETS.find(([v])=>v===chf.preset)[1];
  const periodWindow = currentBillingPeriod(client);
  const entries = state.timeEntries.filter(e=>e.clientId===client.id)
    .filter(e => !period || (new Date(e.clockIn) >= period.start && new Date(e.clockIn) < period.end));
  const total = entries.reduce((s,e)=>s+entryDurationHours(e),0);
  const byAssistant = {};
  entries.forEach(e=>{ byAssistant[e.assistantId] = (byAssistant[e.assistantId]||0) + entryDurationHours(e); });
  const rows = Object.entries(byAssistant).map(([id,hrs])=>({name: assistantName(id), hrs})).sort((a,b)=>b.hrs-a.hrs);
  const pkg = effectivePackageHours(client);
  const week = currentReportWeek();
  const lastPeriodWindow = previousBillingPeriod(client);

  return `
    <div class="card">
      <div class="flex-between">
        <h3>Hours &amp; client reports</h3>
        <select onchange="setClientHoursFilterPreset(this.value)">
          ${CLIENT_HOURS_FILTER_PRESETS.map(([v,label])=>`<option value="${v}" ${chf.preset===v?'selected':''}>${label}</option>`).join("")}
        </select>
      </div>
      ${chf.preset==="period" && !periodWindow ? `<div class="small" style="margin-bottom:8px;">${client.name} doesn't have a renewal date set yet, so this is showing all-time instead — add one on the Membership tab.</div>` : ""}
      <div class="stat-row">
        <div class="stat-tile">
          <div class="stat-label">Hours clocked</div>
          <div class="stat-value">${total.toFixed(1)}</div>
          <div class="stat-sub">${periodLabel}</div>
        </div>
        ${pkg ? `<div class="stat-tile">
          <div class="stat-label">Used this billing period</div>
          <div class="stat-value">${hoursUsed(client.id).toFixed(1)} / ${pkg}</div>
          <div class="stat-sub">membership hours</div>
        </div>` : ""}
      </div>
      ${rows.length ? `
      <div class="table-scroll"><table class="data-table">
        <thead><tr><th>Assistant</th><th>Hours (${periodLabel.toLowerCase()})</th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td>${r.name}</td><td>${r.hrs.toFixed(1)}</td></tr>`).join("")}</tbody>
      </table></div>` : `<div class="small">No time clocked for this client in this range.</div>`}

      <hr style="margin:14px 0;">
      <div class="row">
        <div>
          <div class="small" style="margin-bottom:4px;">Weekly recap &middot; Sat–Fri, week of ${formatPeriodRange(week)}</div>
          <button class="secondary" onclick="downloadClientReport('${client.id}','week')">Download</button>
          <button onclick="emailClientReport('${client.id}','week')">Email client</button>
          <button class="secondary" onclick="copyReportCoverNote('${client.id}','week',this)">Copy message</button>
        </div>
        <div>
          <div class="small" style="margin-bottom:4px;">${periodWindow ? "Period recap &middot; ends " + new Date(periodWindow.end.getTime()-1).toLocaleDateString() : "Period recap — set a renewal date on the Membership tab"}</div>
          ${periodWindow ? `
            <button class="secondary" onclick="downloadClientReport('${client.id}','period')">Download</button>
            <button onclick="emailClientReport('${client.id}','period')">Email client</button>
            <button class="secondary" onclick="copyReportCoverNote('${client.id}','period',this)">Copy message</button>
          ` : ""}
        </div>
        <div>
          <div class="small" style="margin-bottom:4px;">${lastPeriodWindow ? "Last period recap &middot; " + formatPeriodRange(lastPeriodWindow) : "Last period — not enough billing history yet"}</div>
          ${lastPeriodWindow ? `
            <button class="secondary" onclick="downloadClientReport('${client.id}','lastPeriod')">Download</button>
            <button onclick="emailClientReport('${client.id}','lastPeriod')">Email client</button>
            <button class="secondary" onclick="copyReportCoverNote('${client.id}','lastPeriod',this)">Copy message</button>
          ` : ""}
        </div>
      </div>
      ${!client.email ? `<div class="small" style="color:var(--danger);margin-top:8px;">No client email on file — add one on the Membership tab before emailing.</div>` : ""}
    </div>`;
}

function updateClientField(id, field, value){ upsert("clients", id, { [field]: value }); }
// One date drives everything: setting the contract/term start date also
// sets the billing renewal anchor to the same date, so the 30-day period
// and the term end (30/90/365 days out, per termType) both calculate
// automatically instead of needing the renewal date entered separately.
function updateTermStartDate(clientId, value){
  upsert("clients", clientId, { termStartDate: value, renewalDate: value });
}
function setRollover(clientId){
  const hrs = parseFloat(document.getElementById("rollover_hrs_"+clientId).value);
  const periodStart = document.getElementById("rollover_start_"+clientId).value;
  if(!hrs || hrs<=0){ alert("Enter a positive number of hours to roll over."); return; }
  if(!periodStart){ alert("Pick which period this rollover applies to."); return; }
  upsert("clients", clientId, { rolloverHours: hrs, rolloverPeriodStart: periodStart });
}
function clearRollover(clientId){
  upsert("clients", clientId, { rolloverHours: null, rolloverPeriodStart: null });
}
function addExtraHours(clientId){
  const hrsInput = document.getElementById("extra_hrs_"+clientId);
  const hrs = parseFloat(hrsInput.value);
  const periodStart = document.getElementById("extra_start_"+clientId).value;
  const paid = document.getElementById("extra_paid_"+clientId).checked;
  if(!hrs || hrs<=0){ alert("Enter a positive number of hours to add."); return; }
  if(!periodStart){ alert("Pick which period these hours apply to."); return; }
  const client = state.clients.find(c=>c.id===clientId);
  const entry = { id:newId("extrahrs"), hours:hrs, periodStart, paid };
  upsert("clients", clientId, { extraHours: [...(client.extraHours||[]), entry] });
  hrsInput.value = "";
}
function toggleExtraHoursPaid(clientId, entryId){
  const client = state.clients.find(c=>c.id===clientId);
  const extraHours = (client.extraHours||[]).map(e=>e.id===entryId ? { ...e, paid: !e.paid } : e);
  upsert("clients", clientId, { extraHours });
}
function removeExtraHours(clientId, entryId){
  const client = state.clients.find(c=>c.id===clientId);
  upsert("clients", clientId, { extraHours: (client.extraHours||[]).filter(e=>e.id!==entryId) });
}
function selectPackageTier(clientId, val){
  if(val==="custom") return;
  const tier = PACKAGE_TIERS.find(t=>t.key===val);
  if(!tier) return;
  upsert("clients", clientId, { packageHours: tier.hours, packagePrice: tier.price });
}
function markReferralPayoutPaid(clientId){
  const client = state.clients.find(c=>c.id===clientId);
  if(!client) return;
  upsert("clients", clientId, { referralPayoutsPaidCount: (client.referralPayoutsPaidCount||0) + 1 });
}

// Moves a client's OPEN tasks to a new assistant roster in one shot; never
// touches existing time entries, so past history stays attributed correctly.
function openReassignModal(clientId){
  const client = state.clients.find(c=>c.id===clientId);
  if(!client) return;
  state.modal = { type:"reassignClient", client };

}
function renderReassignModal(client){
  const openCount = state.tasks.filter(t=>t.clientId===client.id && t.status!=="Done").length;

function addClientNote(clientId){
  const text = document.getElementById("newNoteText").value.trim();
  if(!text) return;
  const client = state.clients.find(c=>c.id===clientId);
  const notes = client.notes || [];
  upsert("clients", clientId, { notes: [...notes, { id:newId("note"), text, date:new Date().toISOString(), source:"manual" }] });
}
function startEditNote(clientId, index){
  state.editingNote = { clientId, index };
  render();
}
function cancelEditNote(){
  state.editingNote = null;
  render();
}
function saveEditNote(clientId, index){
  const text = document.getElementById("edit_note_"+index).value.trim();
  if(!text) return;
  const client = state.clients.find(c=>c.id===clientId);
  const notes = (client.notes||[]).slice();

function deleteClientNote(clientId, index){
